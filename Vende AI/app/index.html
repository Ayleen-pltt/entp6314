<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VendeAI</title>
<style>
  :root {
    --bg: #f3ecdc;
    --surface: #ffffff;
    --text: #000000;
    --muted: #5c6266;
    --line: #ceccc5;
    --accent: #4c5a62;
    --accent-soft: #e4e8ea;
    --warn: #a35a00;
    --warn-soft: #fdf1e2;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101314;
      --surface: #1b1f22;
      --text: #f3ecdc;
      --muted: #ceccc5;
      --line: #30373b;
      --accent: #a9b8c0;
      --accent-soft: #252d32;
      --warn: #f0a94b;
      --warn-soft: #33281a;
      --danger: #f2867f;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  header { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 5; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .logo { font-weight: 700; font-size: 1.1rem; }
  .logo span { color: var(--accent); }
  .lang { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { background: none; border: 0; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; color: var(--muted); }
  .lang button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  main { padding: 24px 0 64px; }
  h1 { font-size: 1.4rem; letter-spacing: -0.01em; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 16px; }
  h2 { font-size: 1rem; margin: 32px 0 10px; }

  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; font-size: 1rem;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row-actions { display: flex; gap: 10px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff;
  }
  @media (prefers-color-scheme: dark) { .btn { color: #101314; } }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); }
  .examples { margin-top: 14px; font-size: 0.85rem; color: var(--muted); }
  .examples button {
    display: block; width: 100%; text-align: left; margin-top: 6px;
    background: var(--surface); border: 1px dashed var(--line); border-radius: 8px;
    padding: 8px 10px; cursor: pointer; color: var(--text); font-size: 0.88rem;
  }
  .msg { margin-top: 10px; font-size: 0.9rem; color: var(--warn); }

  .card {
    margin-top: 20px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px;
  }
  .card h3 { font-size: 1rem; margin-bottom: 14px; }
  .field { margin-bottom: 14px; }
  .field > label, .field > .label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .field.ask input, .field.ask select, .field.ask .chips { border-color: var(--warn); background: var(--warn-soft); }
  .ask-note { display: none; font-size: 0.8rem; color: var(--warn); margin-top: 4px; }
  .field.ask .ask-note { display: block; }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .sub-box { border-left: 3px solid var(--accent-soft); padding-left: 10px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; border: 1px solid transparent; border-radius: 10px; padding: 2px; }
  .chips button {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 6px 12px; cursor: pointer; font-size: 0.9rem;
  }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .chips button[aria-pressed="true"] { color: #101314; } }
  .total { display: flex; justify-content: space-between; font-weight: 600; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .num { font-variant-numeric: tabular-nums; }
  .schedule { list-style: none; font-size: 0.88rem; color: var(--muted); margin-top: 6px; }
  .effect { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; margin: 6px 0 14px; }
  .effect div + div { margin-top: 2px; }
  .warn { color: var(--danger); font-size: 0.88rem; margin-bottom: 10px; }

  .sales { list-style: none; }
  .sales li {
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .sales .main { font-weight: 600; }
  .sales .meta { font-size: 0.85rem; color: var(--muted); }
  .sales .owes { color: var(--warn); }
  .sales .undone { text-decoration: line-through; opacity: 0.6; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 0.88rem; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 0.92rem; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 0.92rem; max-width: calc(100% - 32px); display: none; z-index: 20;
  }
  footer { border-top: 1px solid var(--line); padding: 20px 0 32px; font-size: 0.82rem; color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  .overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 30;
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay .box { max-width: 360px; width: 100%; text-align: center; }
  .overlay h2 { font-size: 1.2rem; margin: 16px 0 20px; }
  .overlay .btn { display: block; width: 100%; margin-top: 10px; }

  .onboard { align-items: flex-start; overflow-y: auto; }
  .onboard .box { text-align: left; max-width: 420px; padding: 32px 0; }
  .onboard h2 { margin: 16px 0 4px; }
  .ob-sub { color: var(--muted); margin-bottom: 20px; }
  .onboard .field input, .onboard .field select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .check-row { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; margin: 14px 0; font-size: 0.92rem; cursor: pointer; }
  .check-row input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--accent); }
  .check-row a { color: var(--accent); font-weight: 600; }
  .doc-lang { color: var(--muted); font-size: 0.82rem; }
  .ob-error { color: var(--danger); font-size: 0.82rem; margin-top: 4px; }
  .ob-foot { margin-top: 12px; text-align: center; }
  .onboard .btn { margin-top: 18px; }
  .head-actions { display: flex; align-items: center; gap: 8px; }
  .bizbtn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; color: var(--accent); font-weight: 600; white-space: nowrap; }
  @media (max-width: 440px) { .hello { display: none; } .lang button { padding: 4px 8px; } }
  .hello { font-weight: 400; color: var(--muted); font-size: 0.9rem; margin-left: 6px; }
  header .tabs { display: flex; height: auto; justify-content: flex-start; gap: 4px; overflow-x: auto; }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 10px 10px 9px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: 0.92rem; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

  .home-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 6px 12px; cursor: pointer; color: var(--muted); font-size: 0.88rem; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat .k { font-size: 0.8rem; color: var(--muted); }
  .stat .v { font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat.big { grid-column: 1 / -1; }
  .stat.big .v { font-size: 1.9rem; color: var(--accent); }
  .stat .v.owe { color: var(--warn); }
  .stat .small { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
  .panel h2 { margin: 12px 0 4px; }
  .rows { list-style: none; }
  .rows li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .rows li:last-child { border-bottom: 0; }
  .rows .meta { font-size: 0.82rem; color: var(--muted); }
  .rows .late { color: var(--danger); }
  .pill { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 600; white-space: nowrap; }
  .stock-input { width: 64px; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; }
  .bar { height: 8px; background: var(--accent-soft); border-radius: 4px; margin-top: 4px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .home-section { margin-top: 18px; }

  .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .toggle {
    display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .toggle .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .toggle[aria-pressed="true"] .dot { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--accent-soft); }
  .toggle .name { font-weight: 600; font-size: 0.92rem; }
  .toggle .st { font-size: 0.75rem; color: var(--muted); }
  .biz h2 { margin: 22px 0 8px; }
  .biz h2:first-child { margin-top: 4px; }
  .biz .hint { margin: -4px 0 8px; }
  .toggles.flags { margin-top: 8px; }
  .rec { margin-top: 26px; background: var(--accent-soft); border-radius: 14px; padding: 4px 14px 14px; }
  .rec h2 { color: var(--accent); }
  .rec-free { font-size: 0.9rem; margin-bottom: 10px; }
  .rec-item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 8px; font-size: 0.9rem; }
  .rec-why { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .onboard .biz .toggle { background: var(--surface); }
  .onboard .btn.ghost { margin-top: 8px; }
  .soon { margin-top: 20px; font-size: 0.85rem; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }

  .legal-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .legal-links a { color: var(--muted); }
</style>
</head>
<body>

<div class="overlay" id="langPicker" role="dialog" aria-modal="true">
  <div class="box">
    <div class="logo">Vende<span>AI</span></div>
    <h2>¿En qué idioma quieres usar VendeAI?<br><span style="color:var(--muted);font-weight:400">Em qual idioma você quer usar o VendeAI?<br>Which language do you want to use?</span></h2>
    <button class="btn" data-pick="es">Español</button>
    <button class="btn" data-pick="pt">Português</button>
    <button class="btn" data-pick="en">English</button>
  </div>
</div>

<div class="overlay onboard" id="onboard" role="dialog" aria-modal="true" aria-labelledby="ob-title">
  <form class="box" id="obForm" novalidate>
    <div class="logo">Vende<span>AI</span></div>
    <h2 id="ob-title" data-t="obTitle"></h2>
    <p class="ob-sub" data-t="obSub"></p>

    <div class="field">
      <label for="ob-name" data-t="obName"></label>
      <input id="ob-name" autocomplete="nickname" maxlength="40">
    </div>
    <div class="field">
      <label for="ob-contact" data-t="obContact"></label>
      <input id="ob-contact" autocomplete="tel" maxlength="60">
      <div class="hint" data-t="obContactHint"></div>
      <div class="ob-error" id="ob-contact-err" hidden data-t="obContactErr"></div>
    </div>
    <div class="field">
      <label for="ob-country" data-t="obCountry"></label>
      <select id="ob-country"></select>
    </div>

    <label class="check-row">
      <input type="checkbox" id="ob-terms">
      <span><span data-t="obTermsA"></span> <a href="../legal/terminos-y-condiciones.html" target="_blank" rel="noopener" data-t="obTermsLink"></a>. <span data-t="obTermsB"></span> <span class="doc-lang" data-t="docLangNote"></span></span>
    </label>
    <label class="check-row">
      <input type="checkbox" id="ob-privacy">
      <span><span data-t="obPrivacyA"></span> <a href="../legal/politica-de-privacidad.html" target="_blank" rel="noopener" data-t="obPrivacyLink"></a>. <span class="doc-lang" data-t="docLangNote"></span></span>
    </label>

    <button class="btn" id="ob-submit" type="submit" disabled data-t="obStart"></button>
    <p class="hint ob-foot" data-t="obFoot"></p>
  </form>
</div>

<div class="overlay onboard" id="bizStep" role="dialog" aria-modal="true" aria-labelledby="biz-title">
  <div class="box">
    <div class="logo">Vende<span>AI</span></div>
    <h2 id="biz-title" data-t="bizStepTitle"></h2>
    <p class="ob-sub" data-t="bizStepSub"></p>
    <div id="bizStepForm"></div>
    <p class="soon" data-t="chSoon"></p>
    <div class="ob-error" id="bizNeedSector" hidden data-t="bizNeedSector"></div>
    <button class="btn" id="bizDone"></button>
    <button class="btn ghost" id="bizCancel" data-t="bizCancel" hidden></button>
    <p class="hint ob-foot" id="bizFoot" data-t="bizEditLater"></p>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="logo">Vende<span>AI</span> <span class="hello" id="hello"></span></div>
    <div class="head-actions">
    <button class="bizbtn" id="bizOpen" data-t="tabChannels" hidden></button>
    <div class="lang" role="group" aria-label="Idioma">
      <button data-lang="es" aria-pressed="false">ES</button>
      <button data-lang="pt" aria-pressed="false">PT</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    </div>
  </div>
  <nav class="wrap tabs" role="tablist">
    <button role="tab" data-tab="sell" data-t="tabSell"></button>
    <button role="tab" data-tab="home" data-t="tabHome"></button>
  </nav>
</header>

<main class="wrap">
<section id="tab-sell" role="tabpanel">
  <h1 data-t="newSaleTitle"></h1>
  <p class="sub" data-t="newSaleSub"></p>

  <textarea id="saleText" aria-label=""></textarea>
  <div class="row-actions">
    <button class="btn" id="readBtn" data-t="readBtn"></button>
  </div>
  <div class="msg" id="readMsg" hidden></div>

  <div class="examples">
    <span data-t="examplesLabel"></span>
    <div id="exampleList"></div>
  </div>

  <div id="cardHost"></div>

  <h2 data-t="recent"></h2>
  <ul class="sales" id="salesList"></ul>
</section>

<section id="tab-home" role="tabpanel" hidden>
  <div class="home-head">
    <h1 data-t="homeTitle"></h1>
    <div class="seg" role="group">
      <button data-period="week" data-t="periodWeek"></button>
      <button data-period="month" data-t="periodMonth"></button>
    </div>
  </div>
  <div id="homeBody"></div>
</section>

</main>

<footer>
  <div class="wrap">
    <nav class="legal-links" aria-label="Legal">
      <a href="../legal/terminos-y-condiciones.html" target="_blank" rel="noopener" data-t="lgTerms"></a>
      <a href="../legal/politica-de-privacidad.html" target="_blank" rel="noopener" data-t="lgPrivacy"></a>
      <a href="../legal/politica-de-cookies.html" target="_blank" rel="noopener" data-t="lgCookies"></a>
      <a href="../legal/politica-de-reembolsos.html" target="_blank" rel="noopener" data-t="lgRefunds"></a>
    </nav>
  </div>
  <div class="wrap" style="margin-top:12px">
    <span id="demoDate"></span>
    <button class="linkbtn" id="resetBtn" data-t="reset"></button>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

const params = new URLSearchParams(location.search);
function todayDate() {
  const h = params.get('hoy');
  if (h && /^\d{4}-\d{2}-\d{2}$/.test(h)) return parseISO(h);
  const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(iso) {
  if (!iso) return t('noDate');
  return new Intl.DateTimeFormat(t('locale'), { weekday: 'long', day: 'numeric', month: 'short' }).format(parseISO(iso));
}
function round2(n) { return Math.round(n * 100) / 100; }
function money(n) {
  const country = data.profile && COUNTRIES.find(c => c.code === data.profile.country);
  return (country ? country.currency : t('currency')) +Number(n).toLocaleString(t('locale'), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ------------------------------------------------------------------
   Text helpers
------------------------------------------------------------------ */
function t(key, vars) {
  let s = (I18N[lang || 'es'] || I18N.es)[key];
  if (typeof s === 'string' && vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

/* ------------------------------------------------------------------
   parseSale: reads a sale message (Spanish or Portuguese).
   Prototype rules only; a real AI call replaces this later.
   It never invents a value: anything not in the message stays null.
------------------------------------------------------------------ */
const NUM_WORDS = { un: 1, una: 1, uno: 1, um: 1, uma: 1, dos: 2, dois: 2, duas: 2, tres: 3, cuatro: 4, quatro: 4, cinco: 5, seis: 6, siete: 7, sete: 7, ocho: 8, oito: 8, nueve: 9, nove: 9, diez: 10, dez: 10, one: 1, an: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
const WEEKDAYS = { domingo: 0, lunes: 1, segunda: 1, martes: 2, terca: 2, miercoles: 3, quarta: 3, jueves: 4, quinta: 4, viernes: 5, sexta: 5, sabado: 6, sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
const SIZE_WORDS = ['talla', 'talle', 'tamanho', 'numero', 'n', 'size'];
const NOT_NAMES = ['instagram', 'whatsapp', 'facebook', 'insta'];

function toNum(w) {
  if (/^\d+([.,]\d{1,2})?$/.test(w)) return parseFloat(w.replace(',', '.'));
  return Object.prototype.hasOwnProperty.call(NUM_WORDS, w) ? NUM_WORDS[w] : null;
}

function parseSale(text, products, today) {
  const n = norm(text);
  const tokens = n.split(/\s+/)
    .map(w => w.replace(/^r?\$/, '').replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, ''))
    .filter(Boolean);
  const used = new Set();
  const out = {
    productId: null, qty: null, unitPrice: null, wholesale: false,
    productHint: null, customerName: null, channel: null, paidMode: null, paidAmount: null,
    installments: null, dueDate: null
  };

  // Product: match the seller's own products by alias (singular or plural).
  const hits = [];
  tokens.forEach((w, i) => {
    for (const p of products) {
      for (const a of p.aliases || []) {
        if (w === a || w === a + 's' || w === a + 'es') hits.push({ p, i, plural: w !== a });
      }
    }
  });
  const distinct = [...new Set(hits.map(h => h.p.id))];
  if (distinct.length === 1) {
    const h = hits[0];
    out.productId = h.p.id;
    // Quantity: the number right before the product word. A singular word with no number means one.
    const before = h.i > 0 ? toNum(tokens[h.i - 1]) : null;
    const before2 = h.i > 1 && /^[a-z]+$/.test(tokens[h.i - 1]) ? toNum(tokens[h.i - 2]) : null;
    if (before !== null && Number.isInteger(before)) { out.qty = before; used.add(h.i - 1); }
    else if (before2 !== null && Number.isInteger(before2)) { out.qty = before2; used.add(h.i - 2); }
    else if (!h.plural) out.qty = 1;
  } else if (distinct.length === 0) {
    // Unknown product: keep the quantity and the word after it, so a new product can start from it.
    const start = Math.max(0, tokens.findIndex(w => w === 'vendi' || w === 'sold') + 1);
    for (let i = start; i < tokens.length - 1; i++) {
      const k = toNum(tokens[i]);
      if (k !== null && Number.isInteger(k) && /^[a-z]+$/.test(tokens[i + 1])) {
        out.qty = k; out.productHint = tokens[i + 1]; used.add(i); break;
      }
    }
  }

  // Installments: "en 2 cuotas", "em 2 vezes", "em 2 parcelas".
  tokens.forEach((w, i) => {
    if (['cuotas', 'cuota', 'vezes', 'parcelas', 'pagos', 'installments', 'installment', 'payments', 'parts'].includes(w) && i > 0) {
      const k = toNum(tokens[i - 1]);
      if (k !== null) { out.installments = k; used.add(i - 1); }
    }
  });

  // Paid amount stated as a number: "pagó 5", "pagou 10".
  tokens.forEach((w, i) => {
    if ((w === 'pago' || w === 'pagou' || w === 'dio' || w === 'deu' || w === 'paid' || w === 'gave') && i + 1 < tokens.length) {
      const k = toNum(tokens[i + 1]);
      if (k !== null && /\d/.test(tokens[i + 1])) { out.paidMode = 'amount'; out.paidAmount = k; used.add(i + 1); }
    }
  });
  if (!out.paidMode) {
    if (/\b(pago|pagou|dio|deu)\s+(la\s+|a\s+)?(mitad|metade)\b|\b(paid|gave)\s+(me\s+)?half\b/.test(n)) out.paidMode = 'half';
    else if (/\b(pago|pagou)\s+(completo|todo|tudo|total)\b|\b(ya pago|ja pagou|al contado|a vista)\b|\bpaid\s+(in full|everything|all|it all|cash)\b|\balready paid\b/.test(n)) out.paidMode = 'all';
    else if (out.installments || /\b(fiado|me debe|me deve|no pago|nao pagou|me paga|me pagara|vai pagar|va a pagar|owes me|will pay|pays me|on credit|didn.?t pay|did not pay|hasn.?t paid)\b/.test(n)) out.paidMode = 'none';
  }

  // Price: the first number left over, unless it is a size ("talla 38").
  for (let i = 0; i < tokens.length; i++) {
    if (used.has(i) || !/\d/.test(tokens[i])) continue;
    if (i > 0 && SIZE_WORDS.includes(tokens[i - 1])) continue;
    const k = toNum(tokens[i]);
    if (k !== null) { out.unitPrice = k; used.add(i); break; }
  }
  out.wholesale = /\b(por mayor|al mayoreo|no atacado|atacado|wholesale)\b/.test(n);

  // Customer: "a María", "para a Maria", "pra Ana". Names start with a capital letter.
  const NAME = '([A-ZÁÉÍÓÚÑÃÕÂÊÔÇÜ][A-Za-zÁÉÍÓÚÑÃÕÂÊÔÇÜáéíóúñãõâêôçü]+)';
  const m = text.match(new RegExp('(?:para|pra)\\s+(?:a|o)\\s+' + NAME)) ||
            text.match(new RegExp('(?:^|\\s)(?:para|pra)\\s+' + NAME)) ||
            text.match(new RegExp('(?:^|\\s)to\\s+' + NAME)) ||
            text.match(new RegExp('(?:^|\\s)(?:a|al)\\s+(?:la\\s+|el\\s+)?' + NAME));
  if (m && !NOT_NAMES.includes(norm(m[1]))) out.customerName = m[1];

  // Channel.
  if (/\b(instagram|insta)\b/.test(n)) out.channel = 'instagram';
  else if (/\b(facebook|face|marketplace)\b/.test(n)) out.channel = 'facebook';
  else if (/\b(tiktok|tik tok)\b/.test(n)) out.channel = 'tiktok';
  else if (/\b(mercado libre|mercadolibre|mercado livre|meli)\b/.test(n)) out.channel = 'mercadolibre';
  else if (/\b(whatsapp|whats|wpp|zap)\b/.test(n)) out.channel = 'whatsapp';
  else if (/\b(en persona|pessoalmente|presencial|in person)\b/.test(n)) out.channel = 'persona';
  else if (/\b(catalogo|catalog)\b/.test(n)) out.channel = 'catalogo';

  // Due date: a weekday or "mañana / amanhã".
  for (const w of tokens) {
    if (w === 'manana' || w === 'amanha' || w === 'tomorrow') { out.dueDate = toISO(addDays(today, 1)); break; }
    if (Object.prototype.hasOwnProperty.call(WEEKDAYS, w)) {
      const delta = ((WEEKDAYS[w] - today.getDay() + 7) % 7) || 7;
      out.dueDate = toISO(addDays(today, delta)); break;
    }
  }
  return out;
}

/* ------------------------------------------------------------------
   Draft sale: the confirm card's state
------------------------------------------------------------------ */
function productById(id) { return data.products.find(p => p.id === id) || null; }
function findCustomer(name) { const k = norm(name).trim(); return k ? data.customers.find(c => norm(c.name) === k) || null : null; }

function newDraft(text) {
  const today = todayDate();
  const p = parseSale(text, data.products, today);
  const product = productById(p.productId);
  const priceFromList = p.unitPrice === null && !!product;
  return {
    raw: text,
    productId: p.productId || '',
    np: { name: p.productHint ? p.productHint.charAt(0).toUpperCase() + p.productHint.slice(1) : '', stock: '', cost: '', price: '' },
    qty: p.qty,
    unitPrice: priceFromList ? (p.wholesale ? product.wholesale : product.retail) : p.unitPrice,
    priceFromList, wholesale: p.wholesale,
    customerName: p.customerName || '',
    phone: '',
    channel: p.channel || 'none',
    paidMode: p.paidMode, paidAmount: p.paidAmount,
    installments: p.installments || 1,
    dueDate: p.dueDate || (p.installments > 1 ? toISO(addDays(today, 7)) : ''),
    // What the message did not say, so the card asks instead of guessing.
    askProduct: !p.productId, askQty: p.qty === null, askPrice: p.unitPrice === null && !product,
    askPaid: p.paidMode === null, askCustomer: !p.customerName
  };
}

function compute(d) {
  const isNew = d.productId === '__new';
  const product = isNew ? null : productById(d.productId);
  const qty = Number(d.qty) || 0;
  const unit = isNew ? Number(d.np.price) || 0 : Number(d.unitPrice) || 0;
  const total = round2(qty * unit);
  let paid = null;
  if (d.paidMode === 'all') paid = total;
  else if (d.paidMode === 'half') paid = round2(total / 2);
  else if (d.paidMode === 'none') paid = 0;
  else if (d.paidMode === 'amount') paid = Math.min(round2(Number(d.paidAmount) || 0), total);
  const owed = paid === null ? null : round2(total - paid);

  let schedule = [];
  if (owed > 0) {
    const k = Math.max(1, Math.floor(Number(d.installments) || 1));
    const each = round2(owed / k);
    const first = d.dueDate || (k > 1 ? toISO(addDays(todayDate(), 7)) : '');
    for (let i = 0; i < k; i++) {
      const amount = i === k - 1 ? round2(owed - each * (k - 1)) : each;
      const due = first ? toISO(addDays(parseISO(first), 7 * i)) : '';
      schedule.push({ n: i + 1, due, amount });
    }
  }

  const stockFrom = isNew ? Number(d.np.stock) || 0 : product ? product.stock : 0;
  const customerName = d.customerName.trim();
  const productOk = isNew ? d.np.name.trim() && d.np.stock !== '' && Number(d.np.price) > 0 : !!product;
  const missing = {
    product: !productOk,
    qty: !(qty > 0),
    price: !(unit > 0),
    paid: paid === null || (d.paidMode === 'amount' && (d.paidAmount === null || d.paidAmount === '')),
    customer: owed > 0 && !customerName
  };
  const ready = !Object.values(missing).some(Boolean);
  return { isNew, product, qty, unit, total, paid, owed, schedule, stockFrom, stockTo: stockFrom - qty, customerName, missing, ready };
}

  $('c-customer').addEventListener('input', e => { d.customerName = e.target.value; update(); });
  $('c-phone').addEventListener('input', e => { d.phone = e.target.value; });
  $('c-channel').addEventListener('change', e => { d.channel = e.target.value; });
  host.querySelectorAll('[data-paid]').forEach(b => b.addEventListener('click', () => {
    d.paidMode = b.dataset.paid;
    host.querySelectorAll('[data-paid]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('amountBox').hidden = d.paidMode !== 'amount';
    update();
  }));
  $('c-amount').addEventListener('input', e => { d.paidAmount = e.target.value === '' ? null : Number(e.target.value); update(); });
  $('c-inst').addEventListener('input', e => { d.installments = e.target.value; update(); });
  $('c-due').addEventListener('input', e => { d.dueDate = e.target.value; update(); });
  $('saveBtn').addEventListener('click', saveSale);
  $('discardBtn').addEventListener('click', () => { draft = null; renderCard(); });
  update();
}

// Refreshes only the computed parts of the card, so typing never loses focus.
function update() {
  if (!draft) return;
  const d = draft, c = compute(d), $ = id => document.getElementById(id);
  $('c-total').textContent = money(c.total);

  $('f-product').classList.toggle('ask', c.missing.product);
  $('f-qty').classList.toggle('ask', c.missing.qty);
  $('f-price').classList.toggle('ask', !c.isNew && c.missing.price);
  $('f-paid').classList.toggle('ask', c.missing.paid);

  const flagCustomer = c.missing.customer || (!c.customerName && d.askCustomer);
  $('f-customer').classList.toggle('ask', flagCustomer);
  $('customerAsk').textContent = c.owed > 0 ? t('customerAskOwed') : t('customerAskPaid');
  $('phoneBox').hidden = !c.customerName || !!findCustomer(c.customerName);

  const owes = c.owed > 0;
  $('owedBox').hidden = !owes;
  $('dueLabel').textContent = Number(d.installments) > 1 ? t('firstDue') : t('dueDate');
  $('schedule').innerHTML = owes && c.schedule.length > 1
    ? c.schedule.map(s => `<li>${esc(t('scheduleItem', { n: s.n, amount: money(s.amount), date: fmtDate(s.due) }))}</li>`).join('')
    : '';

  const stockName = c.isNew ? (d.np.name.trim() || t('product')) : c.product ? c.product.name : null;
  const lines = [];
  if (stockName && c.qty > 0) lines.push(esc(t('effectStock', { product: stockName, from: c.stockFrom, to: c.stockTo })));
  if (c.owed > 0) {
    const due = c.schedule.length === 1 && c.schedule[0].due ? ` (${esc(fmtDate(c.schedule[0].due))})` : '';
    lines.push(c.customerName
      ? esc(t('effectOwed', { name: c.customerName, amount: money(c.owed) })) + due
      : esc(t('effectOwedNoName', { amount: money(c.owed) })) + due);
  } else if (c.owed === 0 && c.total > 0) lines.push(esc(t('effectPaid')));
  $('effect').innerHTML = lines.map(l => `<div>${l}</div>`).join('');
  $('effect').hidden = lines.length === 0;

  const warn = c.qty > 0 && (c.product || c.isNew) && c.stockTo < 0;
  $('stockWarn').hidden = !warn;
  if (warn) $('stockWarn').textContent = t('stockWarn', { n: c.stockFrom });

  $('saveBtn').disabled = !c.ready;
}

/* ------------------------------------------------------------------
   Saving and undoing
------------------------------------------------------------------ */
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function logChange(type, detail) { data.log.push({ at: new Date().toISOString(), type, detail }); }

function saveSale() {
  const d = draft, c = compute(d);
  if (!c.ready) return;

  let product = c.product;
  if (c.isNew) {
    const name = d.np.name.trim();
    const word = norm(name).split(/\s+/)[0];
    const aliases = [...new Set([word, word.replace(/s$/, ''), word.replace(/es$/, '')])].filter(a => a.length >= 3);
    product = {
      id: uid('p'), name, aliases,
      stock: Number(d.np.stock) || 0, cost: Number(d.np.cost) || 0,
      retail: Number(d.np.price) || 0, wholesale: Number(d.np.price) || 0
    };
    data.products.push(product);
    logChange('product_added', { productId: product.id, name, stock: product.stock });
  }

  let customer = null;
  if (c.customerName) {
    customer = findCustomer(c.customerName);
    if (!customer) {
      customer = { id: uid('c'), name: c.customerName, phone: d.phone.trim() };
      data.customers.push(customer);
      logChange('customer_added', { customerId: customer.id, name: customer.name });
    }
  }

  const from = product.stock;
  product.stock = from - c.qty;
  const sale = {
    id: uid('s'), at: Date.now(), date: toISO(todayDate()), message: null,
    productId: product.id, qty: c.qty, unitPrice: c.unit, unitCost: product.cost, total: c.total, wholesale: d.wholesale,
    customerId: customer ? customer.id : null, channel: d.channel === 'none' ? null : d.channel,
    paid: c.paid, owed: c.owed, schedule: c.schedule.map(s => ({ due: s.due || null, amount: s.amount, paid: false })),
    undone: false
  };
  data.sales.push(sale);
  logChange('sale_saved', { saleId: sale.id, productId: product.id, stockFrom: from, stockTo: product.stock, owed: c.owed });
  saveData();

  draft = null;
  renderCard();
  document.getElementById('saleText').value = '';
  renderSales(); renderHome();
  toast(t('saved', { product: product.name, n: product.stock }));
}

function undoSale(id) {
  const s = data.sales.find(x => x.id === id);
  if (!s || s.undone || Date.now() - s.at > 24 * 3600 * 1000) return;
  const p = productById(s.productId);
  const from = p ? p.stock : null;
  if (p) p.stock += s.qty;
  s.undone = true;
  logChange('sale_undone', { saleId: s.id, productId: s.productId, stockFrom: from, stockTo: p ? p.stock : null });
  saveData();
  renderSales(); renderHome();
  if (p) toast(t('undoneMsg', { product: p.name, n: p.stock }));
}

/* ------------------------------------------------------------------
   Recent sales list
------------------------------------------------------------------ */
function renderSales() {
  const list = document.getElementById('salesList');
  const sales = data.sales.slice().reverse().slice(0, 10);
  if (!sales.length) { list.innerHTML = `<li class="empty">${esc(t('noSales'))}</li>`; return; }
  list.innerHTML = sales.map(s => {
    const p = productById(s.productId);
    const cu = data.customers.find(c => c.id === s.customerId);
    const left = remaining(s);
    const next = s.schedule.find(x => !x.paid);
    const owesTxt = left > 0
      ? `<span class="owes">${esc(t('owesTag', { amount: money(left) }))}${next && next.due ? ', ' + esc(fmtDate(next.due)) : ''}</span>`
      : esc(t('paidTag'));
    const canUndo = !s.undone && Date.now() - s.at < 24 * 3600 * 1000;
    return `<li>
      <div class="${s.undone ? 'undone' : ''}">
        <div class="main">${s.qty} × ${esc(p ? p.name : '?')} · <span class="num">${money(s.total)}</span></div>
        <div class="meta">${esc(cu ? cu.name : t('noCustomer'))}${s.channel ? ' · ' + esc(t('channels')[s.channel]) : ''} · ${owesTxt}</div>
      </div>
      ${s.undone ? `<span class="meta">${esc(t('undoneTag'))}</span>` : canUndo ? `<button class="linkbtn" data-undo="${s.id}">${esc(t('undo'))}</button>` : ''}
    </li>`;
  }).join('');
  list.querySelectorAll('[data-undo]').forEach(b => b.addEventListener('click', () => undoSale(b.dataset.undo)));
}

let period = prefs.period || 'week';

function remaining(s) {
  if (s.undone) return 0;
  return round2(s.schedule.filter(x => !x.paid).reduce((a, x) => a + x.amount, 0));
}
function periodStart() {
  const today = todayDate();
  if (period === 'month') return toISO(new Date(today.getFullYear(), today.getMonth(), 1));
  return toISO(addDays(today, -((today.getDay() + 6) % 7))); // week starts Monday
}
function daysBetween(aISO, bISO) { return Math.round((parseISO(bISO) - parseISO(aISO)) / 86400000); }

function renderHome() {
  const body = document.getElementById('homeBody');
  if (!body) return;
  document.querySelectorAll('[data-period]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.period === period)));

  const todayISO = toISO(todayDate());
  const sales = data.sales.filter(s => !s.undone && s.date >= start);
  const costOf = s => s.qty * (s.unitCost ?? (productById(s.productId) || { cost: 0 }).cost);
  const totalSales = round2(sales.reduce((a, s) => a + s.total, 0));
  const totalCosts = round2(sales.reduce((a, s) => a + costOf(s), 0));
  const earned = round2(totalSales - totalCosts);

  // Who owes: all unpaid installments, whatever the period, grouped by customer.
  const debts = {};
  data.sales.filter(s => !s.undone).forEach(s => {
    s.schedule.forEach((x, idx) => {
      if (x.paid) return;
      const key = s.customerId || 'none';
      (debts[key] = debts[key] || []).push({ sale: s, idx, ...x });

  });
  const owers = Object.entries(debts).map(([cid, items]) => {
    items.sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1);
    const cu = data.customers.find(c => c.id === cid);

  const owedTotal = round2(owers.reduce((a, o) => a + o.total, 0));
  const biz = bizOf();
  const showDebts = !(biz.answeredAt && !biz.credit) || owers.length > 0;

  // Best sellers and channels in the period.
  const byProduct = {}, byChannel = {};
  sales.forEach(s => {

    byChannel[ch] = round2((byChannel[ch] || 0) + s.total);
  });
  const best = Object.entries(byProduct).sort((a, b) => b[1].qty - a[1].qty || b[1].earned - a[1].earned).slice(0, 3);
  const chans = Object.entries(byChannel).sort((a, b) => b[1] - a[1]);

  const stock = data.products.slice().sort((a, b) => a.stock - b.stock);

  body.innerHTML = `
    <div class="stats">
      <div class="stat big"><div class="k">${esc(t('hEarned'))}</div><div class="v ${earned < 0 ? 'owe' : ''}">${money(earned)}</div>
        <div class="small">${esc(t('hEarnedSub', { sales: money(totalSales), costs: money(totalCosts) }))}</div></div>
      <div class="stat"><div class="k">${esc(t('hSales'))}</div><div class="v">${money(totalSales)}</div><div class="small">${esc(t(sales.length === 1 ? 'hSalesSubOne' : 'hSalesSub', { n: sales.length }))}</div></div>
      <div class="stat" ${showDebts ? '' : 'hidden'}><div class="k">${esc(t('hOwed'))}</div><div class="v ${owedTotal > 0 ? 'owe' : ''}">${money(owedTotal)}</div><div class="small">${esc(t(owers.length === 1 ? 'hOwedSubOne' : 'hOwedSub', { n: owers.length }))}</div></div>
    </div>

    <div class="panel home-section" data-panel="who" ${showDebts ? '' : 'hidden'}>
      <h2>${esc(t('hWho'))}</h2>
      <ul class="rows">${owers.length ? owers.map(o => {
        const late = o.next.due && o.next.due < todayISO ? daysBetween(o.next.due, todayISO) : 0;
        return `<li>
          <div><div><strong>${esc(o.name)}</strong> · <span class="num">${money(o.total)}</span></div>
            <div class="meta ${late ? 'late' : ''}">${esc(t('hNext', { amount: money(o.next.amount), date: fmtDate(o.next.due) }))}${late ? ' · ' + esc(t('hLate', { n: late })) : ''}</div></div>
          <button class="linkbtn" data-receive="${o.next.sale.id}:${o.next.idx}">${esc(t('hReceived', { amount: money(o.next.amount) }))}</button>

    </div>

    <div class="panel home-section" data-panel="stock">
      <h2>${esc(t('hStock'))}</h2>
      <ul class="rows">${stock.map(p => `<li>
        <div><div><strong>${esc(p.name)}</strong> ${p.stock <= 0 ? `<span class="pill">${esc(t('hOut'))}</span>` : p.stock <= 3 ? `<span class="pill">${esc(t('hLow'))}</span>` : ''}</div>
          <div class="meta">${esc(bizOf().wholesale
            ? t('hCostPriceW', { cost: money(p.cost), price: money(p.retail), wholesale: money(p.wholesale) })
            : t('hCostPrice', { cost: money(p.cost), price: money(p.retail) }))}</div></div>

      </li>`).join('')}</ul>
      <div style="padding:6px 0 12px">
        <button class="linkbtn" id="addProdBtn">${esc(t('hAddProduct'))}</button>

    </div>

    <div class="panel home-section" data-panel="channels">

  // Put the panels for the seller's biggest needs first.
  const NEED_PANELS = { cobrar: ['who'], inventario: ['stock'], reponer: ['stock'], precios: ['stock'], vender: ['best', 'channels'] };
  const first = [...new Set((bizOf().needs || []).flatMap(n => NEED_PANELS[n] || []))];
  const order = [...first, ...['who', 'stock', 'best', 'channels'].filter(k => !first.includes(k))];
  order.forEach(k => { const el = body.querySelector(`[data-panel="${k}"]`); if (el) body.appendChild(el); });

  body.querySelectorAll('[data-receive]').forEach(b => b.addEventListener('click', () => {
    const [sid, idx] = b.dataset.receive.split(':');

    saveData(); renderHome();
    toast(t('hAdded', { product: name }));
  });
}

const NEEDS = ['ganancia', 'cobrar', 'inventario', 'reponer', 'precios', 'vender'];

// Prototype rules standing in for the AI: guess a category from what the seller typed in "Otro".
const SECTOR_WORDS = {
  belleza: ['maquillaje', 'labial', 'perfume', 'crema', 'cosmetic', 'belleza', 'unas', 'esmalte', 'shampoo', 'maquiagem', 'batom', 'creme', 'beleza', 'unha', 'makeup', 'lipstick', 'beauty', 'nail', 'cream'],
  ropa: ['ropa', 'polo', 'blusa', 'vestido', 'zapat', 'calzado', 'jean', 'pantalon', 'casaca', 'roupa', 'sapato', 'tenis', 'camiseta', 'calca', 'clothes', 'shirt', 'dress', 'shoe', 'pant'],
  accesorios: ['arete', 'collar', 'pulsera', 'joya', 'bisuteria', 'reloj', 'cartera', 'bolso', 'lente', 'brinco', 'colar', 'pulseira', 'joia', 'bijuteria', 'bolsa', 'oculos', 'earring', 'necklace', 'bracelet', 'jewel', 'watch', 'bag'],
  comida: ['pastel', 'torta', 'postre', 'comida', 'empanada', 'galleta', 'chocolate', 'dulce', 'panes', 'panader', 'keke', 'queque', 'bolo', 'doce', 'brigadeiro', 'salgado', 'marmita', 'cake', 'cookie', 'food', 'dessert', 'bread', 'candy'],
  hogar: ['hogar', 'cocina', 'taper', 'vela', 'decora', 'limpieza', 'sabana', 'toalla', 'casa', 'cozinha', 'pote', 'limpeza', 'toalha', 'home', 'kitchen', 'candle', 'container', 'towel', 'clean'],
  salud: ['suplemento', 'vitamina', 'proteina', 'natural', 'salud', 'herbal', 'colageno', 'saude', 'supplement', 'vitamin', 'protein', 'collagen', 'health']
};
function guessSector(text) {
  const words = norm(text).split(/[^a-z]+/).filter(w => w.length >= 3);
  let best = null, bestScore = 0;
  for (const [sector, keys] of Object.entries(SECTOR_WORDS)) {
    const score = words.filter(w => keys.some(k => w.startsWith(k))).length;
    if (score > bestScore) { best = sector; bestScore = score; }
  }
  return best;
}

// Prototype rules standing in for the AI: which paid modules fit this seller, and why.
function recommend() {
  const prof = data.profile || {}, b = bizOf(), needs = b.needs || [], sell = prof.sellChannels || [];
  const recs = [];
  const add = (mod, reasons) => { const r = reasons.filter(Boolean); if (r.length) recs.push({ mod, reasons: r }); };
  add('cobrar', [b.credit && 'credit', needs.includes('cobrar') && 'cobrar']);
  add('precios', [needs.includes('precios') && 'precios', needs.includes('ganancia') && 'ganancia', b.wholesale && 'wholesale']);
  add('vender', [needs.includes('vender') && 'vender', sell.includes('catalogo') && 'catalogo', needs.includes('reponer') && sell.includes('catalogo') && 'reponer']);
  return recs;
}

    <div class="toggles">${SECTORS.map(k => tg('sector', k, t('sectors')[k], b.sector === k)).join('')}</div>
    ${b.sector === 'otro' ? `<div class="field" style="margin-top:10px">
      <label>${esc(t('sectorOtherLabel'))}<input class="sector-other" maxlength="60" placeholder="${esc(t('sectorOtherPh'))}" value="${esc(b.sectorOther || '')}" style="margin-top:4px"></label>
      <div class="sector-guess hint" hidden></div>
    </div>` : ''}
    <h2>${esc(t('chSellTitle'))}</h2>
    <div class="toggles">${SELL_CHANNELS.map(k => tg('sell', k, t('channels')[k], sel.includes(k), true)).join('')}</div>
    <div class="toggles flags">${tg('flag', 'credit', t('bizCredit'), !!b.credit)}${tg('flag', 'wholesale', t('bizWholesale'), !!b.wholesale)}</div>
    <h2>${esc(t('chPayTitle'))}</h2>
    <p class="hint">${esc(t('chPayCountry', { country: country[lang] || country.es }))}</p>
    <div class="toggles">${country.pay.map(k => tg('pay', k, t('pay')[k], pay.includes(k), true)).join('')}</div>
    ${pay.includes('otro') ? `<div class="field" style="margin-top:10px">
      <label>${esc(t('payOtherLabel'))}<input class="pay-other" maxlength="40" placeholder="${esc(t('payOtherPh'))}" value="${esc(prof.payOther || '')}" style="margin-top:4px"></label>
    </div>` : ''}
    <h2>${esc(t('bizNeeds'))}</h2>
    <p class="hint">${esc(t('bizNeedsHint'))}</p>
    <div class="toggles">${NEEDS.map(k => tg('need', k, t('needs')[k], needs.includes(k))).join('')}</div>
    ${recommendHTML()}
  </div>`;
}

function bindBusiness(container, rerender) {
  const sectorOther = container.querySelector('.sector-other');
  if (sectorOther) {
    const guessBox = container.querySelector('.sector-guess');
    const showGuess = () => {
      const g = guessSector(sectorOther.value);
      guessBox.hidden = !g;
      if (g) {
        guessBox.innerHTML = `${esc(t('sectorGuess', { sector: t('sectors')[g] }))} <button type="button" class="linkbtn">${esc(t('sectorUse'))}</button>`;
        guessBox.querySelector('button').addEventListener('click', () => {
          data.profile.business = Object.assign({}, bizOf(), { sector: g });
          logChange('business_changed', { kind: 'sector', key: g, from: 'guess' });
          saveData(); rerender(); applyPlaceholder();
        });
      }
    };
    sectorOther.addEventListener('input', () => {
      if (!data.profile) return;
      data.profile.business = Object.assign({}, bizOf(), { sectorOther: sectorOther.value.trim() });
      saveData(); showGuess();
    });
    showGuess();
  }
  const other = container.querySelector('.pay-other');
  if (other) {
    other.addEventListener('input', () => { if (data.profile) { data.profile.payOther = other.value.trim(); saveData(); } });
    other.addEventListener('change', () => logChange('business_changed', { kind: 'pay', key: 'otro', value: other.value.trim() }));
  }
  container.querySelectorAll('.toggle').forEach(btn => btn.addEventListener('click', () => {
    const prof = data.profile;
    if (!prof) return;
    const b = prof.business = Object.assign({}, bizOf());
    const kind = btn.dataset.kind, key = btn.dataset.key;
    if (kind === 'sector') b.sector = b.sector === key ? null : key;
    else if (kind === 'flag') b[key] = !b[key];
    else if (kind === 'need') {
      const n = b.needs = (b.needs || []).slice();
      const i = n.indexOf(key);
      if (i >= 0) n.splice(i, 1); else { n.push(key); if (n.length > 2) n.shift(); }
    } else {
      const field = kind === 'sell' ? 'sellChannels' : 'payMethods';
      const list = prof[field] = prof[field] || [];
      const i = list.indexOf(key);
      if (i >= 0) list.splice(i, 1); else list.push(key);
    }
    logChange('business_changed', { kind, key });
    saveData();
    rerender();
    applyPlaceholder();
    if (draft) renderCard();
  }));
}

function renderChannels() {
  const host = document.getElementById('bizTab');
  if (!host) return;
  host.innerHTML = data.profile ? businessFormHTML() : '';
  bindBusiness(host, renderChannels);
}

};
function applyStarters() {
  // Only replace products the seller hasn't touched yet.
  if (!data.productsAreStarters || data.sales.length) return;
  const set = SECTOR_STARTERS[bizOf().sector];
  data.products = set
    ? set.map((p, i) => ({ id: 'p' + (i + 1), name: p[lang] || p.es, aliases: p.aliases, stock: p.stock, cost: p.cost, retail: p.retail, wholesale: p.wholesale }))
    : seedData().products;
}
function examplesFor() {
  const s = bizOf().sector, bySector = t('examplesBySector');
  return (data.productsAreStarters && s && bySector[s]) || t('examples');
}

let bizMode = 'first', bizSnapshot = null;
function renderBizStep() {
  const host = document.getElementById('bizStepForm');
  host.innerHTML = businessFormHTML();
  bindBusiness(host, renderBizStep);
  const edit = bizMode === 'edit';
  document.getElementById('biz-title').textContent = edit ? t('chTitle') : t('bizStepTitle');
  document.querySelector('#bizStep .ob-sub').textContent = edit ? t('chSub') : t('bizStepSub');
  document.getElementById('bizDone').textContent = edit ? t('bizSave') : t('bizDone');
  document.getElementById('bizCancel').hidden = !edit;
  document.getElementById('bizFoot').hidden = edit;
  document.getElementById('bizNeedSector').hidden = true;
}
function openBizEditor() {
  bizMode = 'edit';
  bizSnapshot = JSON.stringify({ business: data.profile.business, sell: data.profile.sellChannels, pay: data.profile.payMethods, payOther: data.profile.payOther });
  renderBizStep();
  const el = document.getElementById('bizStep');
  el.style.display = 'flex'; el.scrollTop = 0;
}
document.getElementById('bizOpen').addEventListener('click', openBizEditor);
document.getElementById('bizDone').addEventListener('click', () => {
  if (!bizOf().sector) { document.getElementById('bizNeedSector').hidden = false; return; }
  data.profile.business = Object.assign({}, bizOf(), { answeredAt: bizOf().answeredAt || new Date().toISOString() });
  logChange(bizMode === 'edit' ? 'business_edited' : 'business_answered', { sector: data.profile.business.sector });
  applyStarters();
  saveData();
  document.getElementById('bizStep').style.display = 'none';
  const wasFirst = bizMode === 'first';
  bizMode = 'first';
  applyLang();
  if (wasFirst) showTab('sell'); else renderHome();
});
document.getElementById('bizCancel').addEventListener('click', () => {
  if (bizSnapshot) {
    const s = JSON.parse(bizSnapshot);
    Object.assign(data.profile, { business: s.business, sellChannels: s.sell, payMethods: s.pay, payOther: s.payOther });
    saveData();
  }
  document.getElementById('bizStep').style.display = 'none';
  bizMode = 'first';
  applyLang();
});

function applyPlaceholder() {
  const s = bizOf().sector, bySector = t('inputPhBySector');
  document.getElementById('saleText').placeholder = (s && bySector[s]) || t('inputPh');
}

/* ------------------------------------------------------------------
   Tabs
------------------------------------------------------------------ */
function showTab(name) {
  if (!['sell', 'home'].includes(name)) name = 'sell';
  ['sell', 'home'].forEach(k => { document.getElementById('tab-' + k).hidden = k !== name; });
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  prefs.tab = name; store(PREF_KEY, prefs);
  if (name === 'home') renderHome();
  window.scrollTo(0, 0);
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
document.querySelectorAll('[data-period]').forEach(b => b.addEventListener('click', () => {
  period = b.dataset.period; prefs.period = period; store(PREF_KEY, prefs); renderHome();
}));

/* ------------------------------------------------------------------
   Page wiring
------------------------------------------------------------------ */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  const ta = document.getElementById('saleText');
  ta.setAttribute('aria-label', t('newSaleTitle'));
  applyPlaceholder();
  if (document.getElementById('bizStep').style.display === 'flex') renderBizStep();
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('exampleList').innerHTML = examplesFor().map((ex, i) => `<button type="button" data-ex="${i}">${esc(ex)}</button>`).join('');
  document.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => {
    document.getElementById('saleText').value = examplesFor()[Number(b.dataset.ex)];
    readSale();
  }));
  document.getElementById('demoDate').textContent = t('demoDate', { date: fmtDate(toISO(todayDate())) });
  document.getElementById('hello').textContent = data.profile ? t('hello', { name: data.profile.name }) : '';
  document.getElementById('bizOpen').hidden = !(data.profile && data.profile.business && data.profile.business.answeredAt);
  if (document.getElementById('onboard').style.display === 'flex') {
    const sel = document.getElementById('ob-country'), v = sel.value;
    sel.innerHTML = COUNTRIES.map(c => `<option value="${c.code}">${esc(c[lang] || c.es)}</option>`).join('');
    sel.value = v;
  }
  renderCard();
  renderSales();
  renderHome();
  renderChannels();
}

function setLang(l) {
  lang = l; prefs.lang = l; store(PREF_KEY, prefs);
  document.getElementById('langPicker').style.display = 'none';
  applyLang();
  showOnboardingIfNeeded();
}

/* ------------------------------------------------------------------
   Sign-up: minimum data plus two separate acceptances
------------------------------------------------------------------ */
function hasCurrentConsent(doc) {
  return data.consents.some(c => c.document === doc && c.document_version === DOCS[doc].version && c.action === 'accepted');
}
function needsOnboarding() {
  return !data.profile || !hasCurrentConsent('terminos') || !hasCurrentConsent('privacidad');
}
function showOnboardingIfNeeded() {
  const el = document.getElementById('onboard');
  const biz = document.getElementById('bizStep');
  if (!needsOnboarding()) {
    el.style.display = 'none';
    // Step 2: the business questions, asked once after sign-up (they can be skipped).
    if (data.profile && !(data.profile.business && data.profile.business.answeredAt)) { bizMode = 'first'; renderBizStep(); biz.style.display = 'flex'; biz.scrollTop = 0; }
    else biz.style.display = 'none';
    return;
  }
  biz.style.display = 'none';
  const sel = document.getElementById('ob-country');
  const current = sel.value || (data.profile && data.profile.country) || (lang === 'pt' ? 'BR' : 'MX');
  sel.innerHTML = COUNTRIES.map(c => `<option value="${c.code}">${esc(c[lang] || c.es)}</option>`).join('');
  sel.value = current;
  if (data.profile) {
    document.getElementById('ob-name').value = data.profile.name;
    document.getElementById('ob-contact').value = data.profile.contact;
  }
  el.style.display = 'flex';
  obCheck();
}

function contactType(v) {
  const s = v.trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)) return 'email';
  const digits = s.replace(/[\s\-().+]/g, '');
  if (/^\d{8,15}$/.test(digits)) return 'phone';
  return null;
}
function obCheck() {
  const name = document.getElementById('ob-name').value.trim();
  const contact = document.getElementById('ob-contact').value;
  const ok = name && contactType(contact) &&
    document.getElementById('ob-terms').checked && document.getElementById('ob-privacy').checked;
  document.getElementById('ob-submit').disabled = !ok;
}

function recordConsent(doc) {
  // One record per checkbox. In the real app this is written on the server, append-only,
  // with the IP address and a hash of the exact text shown (see legal/compliance-checklist.md §3).
  data.consents.push({
    id: uid('k'),
    document: doc,
    document_version: DOCS[doc].version,
    document_language: DOCS[doc].language,
    action: 'accepted',
    accepted_at: new Date().toISOString(),
    method: 'checkbox',
    form_id: 'signup_v1',
    app_version: APP_VERSION,
    ui_language: lang,
    user_agent: navigator.userAgent
  });
}

['ob-name', 'ob-contact'].forEach(id => document.getElementById(id).addEventListener('input', () => {
  document.getElementById('ob-contact-err').hidden = true; obCheck();
}));
document.getElementById('ob-contact').addEventListener('blur', e => {
  document.getElementById('ob-contact-err').hidden = !e.target.value.trim() || !!contactType(e.target.value);
});
['ob-terms', 'ob-privacy'].forEach(id => document.getElementById(id).addEventListener('change', obCheck));
document.getElementById('obForm').addEventListener('submit', e => {
  e.preventDefault();
  const contact = document.getElementById('ob-contact').value.trim();
  const type = contactType(contact);
  if (!type) { document.getElementById('ob-contact-err').hidden = false; return; }
  if (!document.getElementById('ob-terms').checked || !document.getElementById('ob-privacy').checked) return;
  // Keep earlier answers (business, channels) if the seller is only accepting a new document version.
  data.profile = Object.assign({}, data.profile, {
    name: document.getElementById('ob-name').value.trim(),
    contact, contactType: type,
    country: document.getElementById('ob-country').value,
    createdAt: (data.profile && data.profile.createdAt) || new Date().toISOString()
  });
  if (!hasCurrentConsent('terminos')) recordConsent('terminos');
  if (!hasCurrentConsent('privacidad')) recordConsent('privacidad');
  logChange('profile_saved', { country: data.profile.country, contactType: type });
  saveData();
  applyLang();
  showOnboardingIfNeeded();
});

function readSale() {
  const text = document.getElementById('saleText').value.trim();
  const msg = document.getElementById('readMsg');
  if (!text) { msg.textContent = t('emptyInput'); msg.hidden = false; return; }
  msg.hidden = true;
  draft = newDraft(text);
  renderCard();
  document.getElementById('cardHost').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

document.getElementById('readBtn').addEventListener('click', readSale);
document.getElementById('saleText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) readSale();
});
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.pick)));
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm(t('resetConfirm'))) return;
  data = seedData(); saveData(); draft = null;
  ['ob-name', 'ob-contact'].forEach(id => { document.getElementById(id).value = ''; });
  ['ob-terms', 'ob-privacy'].forEach(id => { document.getElementById(id).checked = false; });
  applyLang(); showOnboardingIfNeeded();
});

// Older saved data may predate sign-up.
if (!data.consents) data.consents = [];
if (data.profile === undefined) data.profile = null;

if (!lang) { lang = 'es'; document.getElementById('langPicker').style.display = 'flex'; }
applyLang();
showTab(prefs.tab || 'sell');
if (prefs.lang) showOnboardingIfNeeded();
</script>
