function load(key, fallback) {

    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function store(key, value) {

}

/* ------------------------------------------------------------------
   Dates and money
------------------------------------------------------------------ */
const params = new URLSearchParams(location.search);
function todayDate() {
  const h = params.get('hoy');
  if (h && /^\d{4}-\d{2}-\d{2}$/.test(h)) return parseISO(h);
  const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function parseISO(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function toISO(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(iso) {
  if (!iso) return t('noDate');
  return new Intl.DateTimeFormat(t('locale'), { weekday: 'long', day: 'numeric', month: 'short' }).format(parseISO(iso));
}
function round2(n) { return Math.round(n * 100) / 100; }
function money(n) {
  const country = data.profile && COUNTRIES.find(c => c.code === data.profile.country);
  return (country ? country.currency : t('currency')) +Number(n).toLocaleString(t('locale'), { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ------------------------------------------------------------------
   Text helpers
------------------------------------------------------------------ */
function t(key, vars) {
  let s = (I18N[lang || 'es'] || I18N.es)[key];
  if (typeof s === 'string' && vars) for (const k in vars) s = s.split('{' + k + '}').join(vars[k]);
  return s;
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

/* ------------------------------------------------------------------
   parseSale: reads a sale message (Spanish or Portuguese).
   Built-in rules: the fallback when Gemini (readSale) is unavailable.
   It never invents a value: anything not in the message stays null.
------------------------------------------------------------------ */
const NUM_WORDS = { un: 1, una: 1, uno: 1, um: 1, uma: 1, dos: 2, dois: 2, duas: 2, tres: 3, cuatro: 4, quatro: 4, cinco: 5, seis: 6, siete: 7, sete: 7, ocho: 8, oito: 8, nueve: 9, nove: 9, diez: 10, dez: 10, one: 1, an: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
const WEEKDAYS = { domingo: 0, lunes: 1, segunda: 1, martes: 2, terca: 2, miercoles: 3, quarta: 3, jueves: 4, quinta: 4, viernes: 5, sexta: 5, sabado: 6, sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
const SIZE_WORDS = ['talla', 'talle', 'tamanho', 'numero', 'n', 'size'];
const NOT_NAMES = ['instagram', 'whatsapp', 'facebook', 'insta'];

function toNum(w) {
  if (/^\d+([.,]\d{1,2})?$/.test(w)) return parseFloat(w.replace(',', '.'));
  return Object.prototype.hasOwnProperty.call(NUM_WORDS, w) ? NUM_WORDS[w] : null;
}

function parseSale(text, products, today) {
  const n = norm(text);
  const tokens = n.split(/\s+/)
    .map(w => w.replace(/^r?\$/, '').replace(/^[^a-z0-9]+|[^a-z0-9]+$/g, ''))
    .filter(Boolean);
  const used = new Set();
  const out = {
    productId: null, qty: null, unitPrice: null, wholesale: false,
    productHint: null, customerName: null, channel: null, paidMode: null, paidAmount: null,
    installments: null, dueDate: null
  };

  // Product: match the seller's own products by alias (singular or plural).
  const hits = [];
  tokens.forEach((w, i) => {
    for (const p of products) {
      for (const a of p.aliases || []) {
        if (w === a || w === a + 's' || w === a + 'es') hits.push({ p, i, plural: w !== a });
      }
    }
  });
  const distinct = [...new Set(hits.map(h => h.p.id))];
  if (distinct.length === 1) {
    const h = hits[0];
    out.productId = h.p.id;
    // Quantity: the number right before the product word. A singular word with no number means one.
    const before = h.i > 0 ? toNum(tokens[h.i - 1]) : null;
    const before2 = h.i > 1 && /^[a-z]+$/.test(tokens[h.i - 1]) ? toNum(tokens[h.i - 2]) : null;
    if (before !== null && Number.isInteger(before)) { out.qty = before; used.add(h.i - 1); }
    else if (before2 !== null && Number.isInteger(before2)) { out.qty = before2; used.add(h.i - 2); }
    else if (!h.plural) out.qty = 1;
  } else if (distinct.length === 0) {
    // Unknown product: keep the quantity and the word after it, so a new product can start from it.
    const start = Math.max(0, tokens.findIndex(w => w === 'vendi' || w === 'sold') + 1);
    for (let i = start; i < tokens.length - 1; i++) {
      const k = toNum(tokens[i]);
      if (k !== null && Number.isInteger(k) && /^[a-z]+$/.test(tokens[i + 1])) {
        out.qty = k; out.productHint = tokens[i + 1]; used.add(i); break;
      }
    }
  }

  // Installments: "en 2 cuotas", "em 2 vezes", "em 2 parcelas".
  tokens.forEach((w, i) => {
    if (['cuotas', 'cuota', 'vezes', 'parcelas', 'pagos', 'installments', 'installment', 'payments', 'parts'].includes(w) && i > 0) {
      const k = toNum(tokens[i - 1]);
      if (k !== null) { out.installments = k; used.add(i - 1); }
    }
  });

  // Paid amount stated as a number: "pagó 5", "pagou 10".
  tokens.forEach((w, i) => {
    if ((w === 'pago' || w === 'pagou' || w === 'dio' || w === 'deu' || w === 'paid' || w === 'gave') && i + 1 < tokens.length) {
      const k = toNum(tokens[i + 1]);
      if (k !== null && /\d/.test(tokens[i + 1])) { out.paidMode = 'amount'; out.paidAmount = k; used.add(i + 1); }
    }
  });
  if (!out.paidMode) {
    if (/\b(pago|pagou|dio|deu)\s+(la\s+|a\s+)?(mitad|metade)\b|\b(paid|gave)\s+(me\s+)?half\b/.test(n)) out.paidMode = 'half';
    else if (/\b(pago|pagou)\s+(completo|todo|tudo|total)\b|\b(ya pago|ja pagou|al contado|a vista)\b|\bpaid\s+(in full|everything|all|it all|cash)\b|\balready paid\b/.test(n)) out.paidMode = 'all';
    else if (out.installments || /\b(fiado|me debe|me deve|no pago|nao pagou|me paga|me pagara|vai pagar|va a pagar|owes me|will pay|pays me|on credit|didn.?t pay|did not pay|hasn.?t paid)\b/.test(n)) out.paidMode = 'none';
  }

  // Price: the first number left over, unless it is a size ("talla 38").
  for (let i = 0; i < tokens.length; i++) {
    if (used.has(i) || !/\d/.test(tokens[i])) continue;
    if (i > 0 && SIZE_WORDS.includes(tokens[i - 1])) continue;
    const k = toNum(tokens[i]);
    if (k !== null) { out.unitPrice = k; used.add(i); break; }
  }
  out.wholesale = /\b(por mayor|al mayoreo|no atacado|atacado|wholesale)\b/.test(n);

  // Customer: "a María", "para a Maria", "pra Ana". Names start with a capital letter.
  const NAME = '([A-ZÁÉÍÓÚÑÃÕÂÊÔÇÜ][A-Za-zÁÉÍÓÚÑÃÕÂÊÔÇÜáéíóúñãõâêôçü]+)';
  const m = text.match(new RegExp('(?:para|pra)\\s+(?:a|o)\\s+' + NAME)) ||
            text.match(new RegExp('(?:^|\\s)(?:para|pra)\\s+' + NAME)) ||
            text.match(new RegExp('(?:^|\\s)to\\s+' + NAME)) ||
            text.match(new RegExp('(?:^|\\s)(?:a|al)\\s+(?:la\\s+|el\\s+)?' + NAME));
  if (m && !NOT_NAMES.includes(norm(m[1]))) out.customerName = m[1];

  // Channel.
  if (/\b(instagram|insta)\b/.test(n)) out.channel = 'instagram';
  else if (/\b(facebook|face|marketplace)\b/.test(n)) out.channel = 'facebook';
  else if (/\b(tiktok|tik tok)\b/.test(n)) out.channel = 'tiktok';
  else if (/\b(mercado libre|mercadolibre|mercado livre|meli)\b/.test(n)) out.channel = 'mercadolibre';
  else if (/\b(whatsapp|whats|wpp|zap)\b/.test(n)) out.channel = 'whatsapp';
  else if (/\b(en persona|pessoalmente|presencial|in person)\b/.test(n)) out.channel = 'persona';
  else if (/\b(catalogo|catalog)\b/.test(n)) out.channel = 'catalogo';

  // Due date: a weekday or "mañana / amanhã".
  for (const w of tokens) {
    if (w === 'manana' || w === 'amanha' || w === 'tomorrow') { out.dueDate = toISO(addDays(today, 1)); break; }
    if (Object.prototype.hasOwnProperty.call(WEEKDAYS, w)) {
      const delta = ((WEEKDAYS[w] - today.getDay() + 7) % 7) || 7;
      out.dueDate = toISO(addDays(today, delta)); break;
    }
  }
  return out;
}

/* ------------------------------------------------------------------
   Draft sale: the confirm card's state
------------------------------------------------------------------ */
function productById(id) { return data.products.find(p => p.id === id) || null; }
function findCustomer(name) { const k = norm(name).trim(); return k ? data.customers.find(c => norm(c.name) === k) || null : null; }

function newDraft(text, parsed) {
  const today = todayDate();
  const p = parsed || parseSale(text, data.products, today);
  const product = productById(p.productId);
  const priceFromList = p.unitPrice === null && !!product;
  return {
    raw: text,
    productId: p.productId || '',
    np: { name: p.productHint ? p.productHint.charAt(0).toUpperCase() + p.productHint.slice(1) : '', stock: '', cost: '', price: '' },
    qty: p.qty,
    unitPrice: priceFromList ? (p.wholesale ? product.wholesale : product.retail) : p.unitPrice,
    priceFromList, wholesale: p.wholesale,
    customerName: p.customerName || '',
    phone: '',
    channel: p.channel || 'none',
    paidMode: p.paidMode, paidAmount: p.paidAmount,
    installments: p.installments || 1,
    dueDate: p.dueDate || (p.installments > 1 ? toISO(addDays(today, 7)) : ''),
    // What the message did not say, so the card asks instead of guessing.
    askProduct: !p.productId, askQty: p.qty === null, askPrice: p.unitPrice === null && !product,
    askPaid: p.paidMode === null, askCustomer: !p.customerName
  };
}

function compute(d) {
  const isNew = d.productId === '__new';
  const product = isNew ? null : productById(d.productId);
  const qty = Number(d.qty) || 0;
  const unit = isNew ? Number(d.np.price) || 0 : Number(d.unitPrice) || 0;
  const total = round2(qty * unit);
  let paid = null;
  if (d.paidMode === 'all') paid = total;
  else if (d.paidMode === 'half') paid = round2(total / 2);
  else if (d.paidMode === 'none') paid = 0;
  else if (d.paidMode === 'amount') paid = Math.min(round2(Number(d.paidAmount) || 0), total);
  const owed = paid === null ? null : round2(total - paid);

  let schedule = [];
  if (owed > 0) {
    const k = Math.max(1, Math.floor(Number(d.installments) || 1));
    const each = round2(owed / k);
    const first = d.dueDate || (k > 1 ? toISO(addDays(todayDate(), 7)) : '');
    for (let i = 0; i < k; i++) {
      const amount = i === k - 1 ? round2(owed - each * (k - 1)) : each;
      const due = first ? toISO(addDays(parseISO(first), 7 * i)) : '';
      schedule.push({ n: i + 1, due, amount });
    }
  }

  const stockFrom = isNew ? Number(d.np.stock) || 0 : product ? product.stock : 0;
  const customerName = d.customerName.trim();
  const productOk = isNew ? d.np.name.trim() && d.np.stock !== '' && Number(d.np.price) > 0 : !!product;
  const missing = {
    product: !productOk,
    qty: !(qty > 0),
    price: !(unit > 0),
    paid: paid === null || (d.paidMode === 'amount' && (d.paidAmount === null || d.paidAmount === '')),
    customer: owed > 0 && !customerName
  };
  const ready = !Object.values(missing).some(Boolean);
  return { isNew, product, qty, unit, total, paid, owed, schedule, stockFrom, stockTo: stockFrom - qty, customerName, missing, ready };
}

// Refreshes only the computed parts of the card, so typing never loses focus.
function update() {
  if (!draft) return;
  const d = draft, c = compute(d), $ = id => document.getElementById(id);
  $('c-total').textContent = money(c.total);

  $('f-product').classList.toggle('ask', c.missing.product);
  $('f-qty').classList.toggle('ask', c.missing.qty);
  $('f-price').classList.toggle('ask', !c.isNew && c.missing.price);
  $('f-paid').classList.toggle('ask', c.missing.paid);

  const flagCustomer = c.missing.customer || (!c.customerName && d.askCustomer);
  $('f-customer').classList.toggle('ask', flagCustomer);
  $('customerAsk').textContent = c.owed > 0 ? t('customerAskOwed') : t('customerAskPaid');
  $('phoneBox').hidden = !c.customerName || !!findCustomer(c.customerName);

  const owes = c.owed > 0;
  $('owedBox').hidden = !owes;
  $('dueLabel').textContent = Number(d.installments) > 1 ? t('firstDue') : t('dueDate');
  $('schedule').innerHTML = owes && c.schedule.length > 1
    ? c.schedule.map(s => `<li>${esc(t('scheduleItem', { n: s.n, amount: money(s.amount), date: fmtDate(s.due) }))}</li>`).join('')
    : '';

  const stockName = c.isNew ? (d.np.name.trim() || t('product')) : c.product ? c.product.name : null;
  const lines = [];
  if (stockName && c.qty > 0) lines.push(esc(t('effectStock', { product: stockName, from: c.stockFrom, to: c.stockTo })));
  if (c.owed > 0) {
    const due = c.schedule.length === 1 && c.schedule[0].due ? ` (${esc(fmtDate(c.schedule[0].due))})` : '';
    lines.push(c.customerName
      ? esc(t('effectOwed', { name: c.customerName, amount: money(c.owed) })) + due
      : esc(t('effectOwedNoName', { amount: money(c.owed) })) + due);
  } else if (c.owed === 0 && c.total > 0) lines.push(esc(t('effectPaid')));
  $('effect').innerHTML = lines.map(l => `<div>${l}</div>`).join('');
  $('effect').hidden = lines.length === 0;

  const warn = c.qty > 0 && (c.product || c.isNew) && c.stockTo < 0;
  $('stockWarn').hidden = !warn;
  if (warn) $('stockWarn').textContent = t('stockWarn', { n: c.stockFrom });

  $('saveBtn').disabled = !c.ready;
}

/* ------------------------------------------------------------------
   Saving and undoing
------------------------------------------------------------------ */
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function logChange(type, detail) { data.log.push({ at: new Date().toISOString(), type, detail }); }

function saveSale() {
  const d = draft, c = compute(d);
  if (!c.ready) return;

  let product = c.product;
  if (c.isNew) {
    const name = d.np.name.trim();
    const word = norm(name).split(/\s+/)[0];
    const aliases = [...new Set([word, word.replace(/s$/, ''), word.replace(/es$/, '')])].filter(a => a.length >= 3);
    product = {
      id: uid('p'), name, aliases,
      stock: Number(d.np.stock) || 0, cost: Number(d.np.cost) || 0,
      retail: Number(d.np.price) || 0, wholesale: Number(d.np.price) || 0
    };
    data.products.push(product);
    logChange('product_added', { productId: product.id, name, stock: product.stock });
  }

  let customer = null;
  if (c.customerName) {
    customer = findCustomer(c.customerName);
    if (!customer) {
      customer = { id: uid('c'), name: c.customerName, phone: d.phone.trim() };
      data.customers.push(customer);
      logChange('customer_added', { customerId: customer.id, name: customer.name });
    }
  }

  const from = product.stock;
  product.stock = from - c.qty;
  const sale = {
    id: uid('s'), at: Date.now(), date: toISO(todayDate()), message: null,
    productId: product.id, qty: c.qty, unitPrice: c.unit, unitCost: product.cost, total: c.total, wholesale: d.wholesale,
    customerId: customer ? customer.id : null, channel: d.channel === 'none' ? null : d.channel,
    paid: c.paid, owed: c.owed, schedule: c.schedule.map(s => ({ due: s.due || null, amount: s.amount, paid: false })),
    undone: false
  };
  if (d.importRef) {
    const [platform, idx] = d.importRef.split(':');
    sale.source = platform;
    const conn = data.connections[platform];
    if (conn && !conn.done.includes(Number(idx))) conn.done.push(Number(idx));
  }
  data.sales.push(sale);
  logChange('sale_saved', { saleId: sale.id, productId: product.id, stockFrom: from, stockTo: product.stock, owed: c.owed });
  saveData();

  draft = null;
  renderCard();
  document.getElementById('saleText').value = '';
  renderSales(); renderHome();
  toast(t('saved', { product: product.name, n: product.stock }));
}

function undoSale(id) {
  const s = data.sales.find(x => x.id === id);
  if (!s || s.undone || Date.now() - s.at > 24 * 3600 * 1000) return;
  const p = productById(s.productId);
  const from = p ? p.stock : null;
  if (p) p.stock += s.qty;
  s.undone = true;
  logChange('sale_undone', { saleId: s.id, productId: s.productId, stockFrom: from, stockTo: p ? p.stock : null });
  saveData();
  renderSales(); renderHome();
  if (p) toast(t('undoneMsg', { product: p.name, n: p.stock }));
}

function renderSales() {
  const list = document.getElementById('salesList');
  const sales = data.sales.slice().reverse().slice(0, 10);
  if (!sales.length) { list.innerHTML = `<li class="empty">${esc(t('noSales'))}</li>`; return; }
  list.innerHTML = sales.map(s => {
    const p = productById(s.productId);
    const cu = data.customers.find(c => c.id === s.customerId);
    const left = remaining(s);
    const next = s.schedule.find(x => !x.paid);
    const owesTxt = left > 0
      ? `<span class="owes">${esc(t('owesTag', { amount: money(left) }))}${next && next.due ? ', ' + esc(fmtDate(next.due)) : ''}</span>`
      : esc(t('paidTag'));
    const canUndo = !s.undone && Date.now() - s.at < 24 * 3600 * 1000;
    return `<li>
      <div class="${s.undone ? 'undone' : ''}">
        <div class="main">${s.qty} × ${esc(p ? p.name : '?')} · <span class="num">${money(s.total)}</span></div>
        <div class="meta">${esc(cu ? cu.name : t('noCustomer'))}${s.channel ? ' · ' + esc(t('channels')[s.channel]) : ''}${s.source && s.source !== s.channel ? ' · ' + esc(t('cnVia', { name: connName(s.source) })) : ''} · ${owesTxt}</div>
      </div>
      ${s.undone ? `<span class="meta">${esc(t('undoneTag'))}</span>` : canUndo ? `<button class="linkbtn" data-undo="${s.id}">${esc(t('undo'))}</button>` : ''}
    </li>`;
  }).join('');
  list.querySelectorAll('[data-undo]').forEach(b => b.addEventListener('click', () => undoSale(b.dataset.undo)));
}

let period = prefs.period || 'week';

function remaining(s) {
  if (s.undone) return 0;
  return round2(s.schedule.filter(x => !x.paid).reduce((a, x) => a + x.amount, 0));
}
function periodStart() {
  const today = todayDate();
  if (period === 'month') return toISO(new Date(today.getFullYear(), today.getMonth(), 1));
  return toISO(addDays(today, -((today.getDay() + 6) % 7))); // week starts Monday
}
function daysBetween(aISO, bISO) { return Math.round((parseISO(bISO) - parseISO(aISO)) / 86400000); }

function renderHome() {
  const body = document.getElementById('homeBody');
  if (!body) return;

  data.sales.filter(s => !s.undone).forEach(s => {

const SECTORS = ['belleza', 'ropa', 'accesorios', 'comida', 'hogar', 'salud', 'otro'];
const NEEDS = ['ganancia', 'cobrar', 'inventario', 'reponer', 'precios', 'vender'];

// Prototype rules standing in for the AI: guess a category from what the seller typed in "Otro".
const SECTOR_WORDS = {
  belleza: ['maquillaje', 'labial', 'perfume', 'crema', 'cosmetic', 'belleza', 'unas', 'esmalte', 'shampoo', 'maquiagem', 'batom', 'creme', 'beleza', 'unha', 'makeup', 'lipstick', 'beauty', 'nail', 'cream'],
  ropa: ['ropa', 'polo', 'blusa', 'vestido', 'zapat', 'calzado', 'jean', 'pantalon', 'casaca', 'roupa', 'sapato', 'tenis', 'camiseta', 'calca', 'clothes', 'shirt', 'dress', 'shoe', 'pant'],
  accesorios: ['arete', 'collar', 'pulsera', 'joya', 'bisuteria', 'reloj', 'cartera', 'bolso', 'lente', 'brinco', 'colar', 'pulseira', 'joia', 'bijuteria', 'bolsa', 'oculos', 'earring', 'necklace', 'bracelet', 'jewel', 'watch', 'bag'],
  comida: ['pastel', 'torta', 'postre', 'comida', 'empanada', 'galleta', 'chocolate', 'dulce', 'panes', 'panader', 'keke', 'queque', 'bolo', 'doce', 'brigadeiro', 'salgado', 'marmita', 'cake', 'cookie', 'food', 'dessert', 'bread', 'candy'],
  hogar: ['hogar', 'cocina', 'taper', 'vela', 'decora', 'limpieza', 'sabana', 'toalla', 'casa', 'cozinha', 'pote', 'limpeza', 'toalha', 'home', 'kitchen', 'candle', 'container', 'towel', 'clean'],
  salud: ['suplemento', 'vitamina', 'proteina', 'natural', 'salud', 'herbal', 'colageno', 'saude', 'supplement', 'vitamin', 'protein', 'collagen', 'health']
};
function guessSector(text) {
  const words = norm(text).split(/[^a-z]+/).filter(w => w.length >= 3);
  let best = null, bestScore = 0;
  for (const [sector, keys] of Object.entries(SECTOR_WORDS)) {
    const score = words.filter(w => keys.some(k => w.startsWith(k))).length;
    if (score > bestScore) { best = sector; bestScore = score; }
  }
  return best;
}

// Prototype rules standing in for the AI: which paid modules fit this seller, and why.
function recommend() {
  const prof = data.profile || {}, b = bizOf(), needs = b.needs || [], sell = prof.sellChannels || [];
  const recs = [];
  const add = (mod, reasons) => { const r = reasons.filter(Boolean); if (r.length) recs.push({ mod, reasons: r }); };
  add('cobrar', [b.credit && 'credit', needs.includes('cobrar') && 'cobrar']);
  add('precios', [needs.includes('precios') && 'precios', needs.includes('ganancia') && 'ganancia', b.wholesale && 'wholesale']);
  add('vender', [needs.includes('vender') && 'vender', sell.includes('catalogo') && 'catalogo', needs.includes('reponer') && sell.includes('catalogo') && 'reponer']);
  return recs;
}

    other.addEventListener('input', () => { if (data.profile) { data.profile.payOther = other.value.trim(); saveData(); } });
    other.addEventListener('change', () => logChange('business_changed', { kind: 'pay', key: 'otro', value: other.value.trim() }));
  }
  container.querySelectorAll('.toggle').forEach(btn => btn.addEventListener('click', () => {
    const prof = data.profile;
    if (!prof) return;
    const b = prof.business = Object.assign({}, bizOf());
    const kind = btn.dataset.kind, key = btn.dataset.key;
    if (kind === 'sector') b.sector = b.sector === key ? null : key;
    else if (kind === 'flag') b[key] = !b[key];
    else if (kind === 'need') {
      const n = b.needs = (b.needs || []).slice();
      const i = n.indexOf(key);
      if (i >= 0) n.splice(i, 1); else { n.push(key); if (n.length > 2) n.shift(); }
    } else {
      const field = kind === 'sell' ? 'sellChannels' : 'payMethods';
      const list = prof[field] = prof[field] || [];
      const i = list.indexOf(key);
      if (i >= 0) list.splice(i, 1); else list.push(key);
    }
    logChange('business_changed', { kind, key });
    saveData();
    rerender();
    applyPlaceholder();
    if (draft) renderCard();
  }));
}

function addImportedSale(r, source) {
  let product = r.productId ? productById(r.productId) : null;
  if (!product) {
    const word = norm(r.newName).split(/\s+/)[0];
    product = { id: uid('p'), name: r.newName, aliases: [...new Set([word, word.replace(/s$/, '')])].filter(a => a.length >= 3),
      stock: r.qty, cost: 0, retail: r.unit, wholesale: r.unit };
    data.products.push(product);
    logChange('product_added', { productId: product.id, name: product.name, stock: product.stock, source });
  }
  let customer = null;
  if (r.customer) {
    customer = findCustomer(r.customer);
    if (!customer) { customer = { id: uid('c'), name: r.customer, phone: '' }; data.customers.push(customer); }
  }
  const total = round2(r.qty * r.unit);
  const paid = Math.min(round2(r.paid ?? total), total), owed = round2(total - paid);
  const from = product.stock;
  product.stock = from - r.qty;
  const sale = {
    id: uid('s'), at: Date.now(), date: r.date || toISO(todayDate()), message: null,
    productId: product.id, qty: r.qty, unitPrice: r.unit, unitCost: product.cost, total, wholesale: false,
    customerId: customer ? customer.id : null, channel: r.channel || null, source,
    paid, owed, schedule: owed > 0 ? [{ due: null, amount: owed, paid: false }] : [], undone: false
  };
  data.sales.push(sale);
  data.productsAreStarters = false;
  logChange('sale_imported', { saleId: sale.id, source, productId: product.id, stockFrom: from, stockTo: product.stock, owed });
}

// ----- Excel / Google Sheets saved as CSV -----
function parseCSV(text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) return null;
  const counts = [';', ',', '\t'].map(d => [d, lines[0].split(d).length]);
  const delim = counts.sort((a, b) => b[1] - a[1])[0][0];
  const split = line => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
      else if (ch === delim && !q) { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(x => x.trim());
  };
  const KEYS = { date: ['fecha', 'date', 'data', 'dia'], product: ['producto', 'product', 'produto', 'articulo', 'item'],
    qty: ['cantidad', 'cant', 'qty', 'quantity', 'quantidade', 'qtd'], price: ['precio', 'price', 'preco', 'valor'],
    customer: ['cliente', 'customer', 'client', 'comprador', 'buyer'], paid: ['pagado', 'paid', 'pago', 'pagou', 'abono'] };
  const head = split(lines[0]).map(h => norm(h));
  const col = {};
  for (const [k, words] of Object.entries(KEYS)) col[k] = head.findIndex(h => words.some(w => h.startsWith(w)));
  if (col.product < 0 || col.qty < 0 || col.price < 0) return null;
  const num = v => {
    let x = String(v || '').replace(/[^\d.,-]/g, '');
    if (!x) return null;
    if (x.includes(',') && x.includes('.')) x = x.lastIndexOf(',') > x.lastIndexOf('.') ? x.replace(/\./g, '').replace(',', '.') : x.replace(/,/g, '');
    else x = x.replace(',', '.');
    const n = parseFloat(x); return isNaN(n) ? null : n;
  };
  const date = v => {
    const s = String(v || '').trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return toISO(new Date(+m[1], +m[2] - 1, +m[3]));
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (m) return toISO(new Date(m[3].length === 2 ? 2000 + +m[3] : +m[3], +m[2] - 1, +m[1]));
    return null;
  };
  const rows = [];
  for (const line of lines.slice(1)) {
    const c = split(line);
    const name = c[col.product], qty = Math.floor(num(c[col.qty]) || 0), unit = num(c[col.price]);
    if (!name || !(qty > 0) || !(unit > 0)) continue;
    const n = norm(name).trim();
    const p = data.products.find(x => norm(x.name) === n) ||
      data.products.find(x => (x.aliases || []).some(a => n.split(/\s+/).some(w => w.startsWith(a))));
    rows.push({
      productId: p ? p.id : null, newName: p ? null : name, label: p ? p.name : name, qty, unit: round2(unit),
      customer: col.customer >= 0 ? c[col.customer] || '' : '', paid: col.paid >= 0 ? num(c[col.paid]) : null,
      date: col.date >= 0 ? date(c[col.date]) : null
    });
  }
  return rows.length ? rows : null;
}
function sampleCSV() {
  const p = data.products, h = t('cnCsvHead').join(';'), d0 = toISO(todayDate()), d1 = toISO(addDays(todayDate(), -1));
  const rows = [h];
  if (p[0]) rows.push([d1, p[0].name, 2, p[0].retail, 'Gabriela', p[0].retail * 2].join(';'));
  if (p[1]) rows.push([d1, p[1].name, 1, p[1].retail, 'Diana', 0].join(';'));
  if (p[2]) rows.push([d0, p[2].name, 1, p[2].retail, 'Patricia', round2(p[2].retail / 2)].join(';'));
  rows.push([d0, lang === 'en' ? 'Gift bag' : lang === 'pt' ? 'Sacola de presente' : 'Bolsa de regalo', 3, 2, '', ''].join(';'));
  return rows.join('\n');
}

    saveData(); renderConnect(); renderSales(); renderHome();
    toast(t('cnImported', { n }));
  });
}

/* ------------------------------------------------------------------
   App on the phone (PWA). Android and computers get an Install button;
   iPhone needs Safari's Share > Add to Home Screen, so we explain that.
   The offline helper (sw.js) keeps a copy of the app on the phone.
------------------------------------------------------------------ */
let installPrompt = null;
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function renderInstall() {
  const canInstall = !isInstalled() && (installPrompt || isIOS());
  const card = document.getElementById('installCard');
  card.hidden = !canInstall || !!prefs.installLater;
  document.getElementById('instFooter').hidden = !canInstall;
  document.getElementById('instBody').textContent = installPrompt ? t('instBody') : t('instBodyIOS');
  document.getElementById('instBtn').textContent = installPrompt ? t('instBtn') : t('instOK');
}
async function doInstall() {
  if (!installPrompt) { prefs.installLater = true; store(PREF_KEY, prefs); renderInstall(); return; }   // iPhone: they follow the steps
  installPrompt.prompt();
  const choice = await installPrompt.userChoice;
  installPrompt = null;
  if (choice.outcome === 'accepted') toast(t('instDone'));
  renderInstall();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; renderInstall(); });
window.addEventListener('appinstalled', () => { installPrompt = null; renderInstall(); });
document.getElementById('instBtn').addEventListener('click', doInstall);
document.getElementById('instLater').addEventListener('click', () => { prefs.installLater = true; store(PREF_KEY, prefs); renderInstall(); });
document.getElementById('instFooter').addEventListener('click', () => {
  prefs.installLater = false; store(PREF_KEY, prefs); renderInstall(); showTab('sell');
  if (installPrompt) doInstall();
});

function renderOnline() { document.getElementById('offlineBar').hidden = navigator.onLine; }
window.addEventListener('online', renderOnline);
window.addEventListener('offline', renderOnline);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => { /* the app still works online */ });
}

/* ------------------------------------------------------------------
   Weather (Open-Meteo, no key). The page asks our own server, GET /api/weather?country=XX,
   which asks Open-Meteo for the current temperature in °C in the main city of the
   seller's country. Asked when the app opens, every 30 minutes while it is on screen,
   and when the seller comes back to it after that. If it fails or takes over 6 seconds,
   a short note shows instead and nothing else is affected.
------------------------------------------------------------------ */
const WX_EVERY = 30 * 60 * 1000;
let wx = { country: null, at: 0, state: 'idle', city: '', temp: null };

function renderWeather() {
  const el = document.getElementById('wx');
  const country = data.profile && data.profile.country;
  if (!country || location.protocol === 'file:') { el.hidden = true; return; }
  if (wx.country !== country || (Date.now() - wx.at > WX_EVERY && wx.state !== 'loading')) loadWeather(country);
  el.hidden = false;
  if (wx.state === 'ok') el.innerHTML = `${esc(wx.city)} · <b>${wx.temp} °C</b>`;
  else el.textContent = t(wx.state === 'loading' ? 'wxLoading' : 'wxFail');
}

async function loadWeather(country) {
  wx = { country, at: Date.now(), state: 'loading', city: '', temp: null };
  let next = { state: 'fail' };
  try {
    const res = await fetch('/api/weather?country=' + encodeURIComponent(country), { signal: AbortSignal.timeout(6000) });
    const body = await res.json();
    if (res.ok && typeof body.temp === 'number') next = { state: 'ok', city: body.city, temp: body.temp };
  } catch (e) { /* slow, offline or refused: the note says so */ }
  if (wx.country !== country) return;   // the seller changed country meanwhile
  Object.assign(wx, next, { at: Date.now() });
  renderWeather();
}
setInterval(() => { if (!document.hidden) renderWeather(); }, 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderWeather(); });

/* ------------------------------------------------------------------
   Files (Supabase Storage). Three private buckets: comprobantes, catalogos, stock.
   Each file is saved as <bucket>/<user id>/<time>-<name>. The storage rule in
   supabase/migrations/0003_storage.sql lets only that signed-in seller list, open,
   add or delete files in their own folder, and Storage itself refuses anything that
   is not JPG, PNG or PDF (plus Excel in "stock"), or is over 5 MB. The app checks the
   same first, to explain.
   Files open through a link that works for 60 seconds.
------------------------------------------------------------------ */
const FILE_BUCKETS = ['comprobantes', 'catalogos', 'stock'];
const FILE_MAX = 5 * 1024 * 1024;
// What the first bytes of each allowed type look like, so a renamed file is refused.
// Excel files also need the right ending, since .xlsx starts like any zip file.
const XLSX = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', XLS = 'application/vnd.ms-excel';
const FILE_TYPES = [
  { mime: 'image/jpeg', sig: [0xFF, 0xD8, 0xFF] },
  { mime: 'image/png', sig: [0x89, 0x50, 0x4E, 0x47] },
  { mime: 'application/pdf', sig: [0x25, 0x50, 0x44, 0x46] },
  { mime: XLSX, sig: [0x50, 0x4B, 0x03, 0x04], ext: /.xlsx$/i },
  { mime: XLS, sig: [0xD0, 0xCF, 0x11, 0xE0], ext: /.xls$/i }
];
const BASIC = ['image/jpeg', 'image/png', 'application/pdf'];
const FILE_ALLOW = { comprobantes: BASIC, catalogos: BASIC, stock: BASIC.concat(XLSX, XLS) };
const fileAccept = b => '.jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf' + (b === 'stock' ? ',.xlsx,.xls,' + XLSX + ',' + XLS : '');
let files = { uid: null, list: [], error: false, loading: false }, fileKind = 'comprobantes', fileMsg = null, fileBusy = false;

async function fileType(file) {
  const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const hit = FILE_TYPES.find(k => k.sig.every((b, i) => head[i] === b) && (!k.ext || k.ext.test(file.name)));
  return hit ? hit.mime : null;
}
const fileSize = n => n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1024 / 1024).toFixed(1) + ' MB';
// Storage keys allow only plain letters, digits and . _ -
const cleanName = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+/, '').slice(-80) || 'archivo';

async function loadFiles() {
  if (!sb || !user) return;
  const uid = user.id;
  files = { uid, list: files.uid === uid ? files.list : [], error: false, loading: true };
  const res = await Promise.all(FILE_BUCKETS.map(b =>
    sb.storage.from(b).list(uid, { limit: 100, sortBy: { column: 'created_at', order: 'desc' } }).catch(() => ({ error: true }))));
  if (!user || user.id !== uid) return;
  files = { uid, loading: false, error: res.some(x => x.error),
    list: res.flatMap((x, i) => (x.data || []).filter(o => o.id).map(o => ({
      bucket: FILE_BUCKETS[i], path: uid + '/' + o.name, name: o.name.replace(/^\d+-/, ''),
      size: (o.metadata && o.metadata.size) || 0, at: o.created_at || ''
    }))).sort((a, b) => b.at.localeCompare(a.at)) };
  renderFiles();
}

function renderFiles() {
  const box = document.getElementById('filesBody');
  if (!box) return;
  if (!sb || !user) { box.innerHTML = `<p class="empty" style="padding:6px 0 12px">${esc(t('fSignIn'))}</p>`; return; }
  if (files.uid !== user.id && !files.loading) { loadFiles(); }
  const kinds = t('fKinds');
  const list = files.uid === user.id ? files.list : [];
  box.innerHTML = `
    <p class="meta" style="margin:0 0 10px">${esc(t('fSub'))}</p>
    <div class="files-add">
      <div class="field"><label for="f-kind">${esc(t('fKind'))}</label>
        <select id="f-kind">${FILE_BUCKETS.map(b => `<option value="${b}" ${b === fileKind ? 'selected' : ''}>${esc(kinds[b])}</option>`).join('')}</select></div>
      <input type="file" id="f-input" accept="${fileAccept(fileKind)}" hidden>
      <button class="btn" id="f-pick" ${fileBusy ? 'disabled' : ''}>${esc(fileBusy ? t('fUploading') : t('fPick'))}</button>
      ${fileMsg ? `<div class="msg ${fileMsg.ok ? 'ok' : ''}" role="status">${esc(fileMsg.text)}</div>` : ''}
    </div>
    <ul class="rows">${list.length ? list.map((f, i) => `<li>
      <div><div class="fname"><strong>${esc(f.name)}</strong></div>
        <div class="meta">${esc(kinds[f.bucket])} · ${fileSize(f.size)}${f.at ? ' · ' + esc(fmtDate(f.at.slice(0, 10))) : ''}</div></div>
      <div><button class="linkbtn" data-fopen="${i}">${esc(t('fOpen'))}</button> <button class="linkbtn" data-fdel="${i}">${esc(t('fDelete'))}</button></div>
    </li>`).join('') : `<li class="empty">${esc(files.loading ? t('fLoading') : files.error ? t('fLoadErr') : t('fNone'))}</li>`}</ul>
    ${files.error && !files.loading ? `<p style="margin:0 0 12px"><button class="linkbtn" id="f-retry">${esc(t('fRetry'))}</button></p>` : ''}`;

  const input = box.querySelector('#f-input');
  box.querySelector('#f-kind').addEventListener('change', e => { fileKind = e.target.value; fileMsg = null; renderFiles(); });
  box.querySelector('#f-pick').addEventListener('click', () => input.click());
  input.addEventListener('change', () => { if (input.files[0]) uploadFile(input.files[0], fileKind); });
  const retry = box.querySelector('#f-retry');
  if (retry) retry.addEventListener('click', loadFiles);
  box.querySelectorAll('[data-fopen]').forEach(b => b.addEventListener('click', () => openFile(list[Number(b.dataset.fopen)])));
  box.querySelectorAll('[data-fdel]').forEach(b => b.addEventListener('click', () => deleteFile(list[Number(b.dataset.fdel)])));
}

async function uploadFile(file, bucket) {
  if (!sb || !user || fileBusy || !FILE_BUCKETS.includes(bucket)) return;
  fileMsg = null;
  if (file.size > FILE_MAX) { fileMsg = { text: t('fTooBig', { size: fileSize(file.size) }) }; return renderFiles(); }
  const type = await fileType(file).catch(() => null);
  if (!type || !FILE_ALLOW[bucket].includes(type)) { fileMsg = { text: t(bucket === 'stock' ? 'fBadTypeStock' : 'fBadType') }; return renderFiles(); }
  fileBusy = true; renderFiles();
  const path = user.id + '/' + Date.now() + '-' + cleanName(file.name);
  const res = await sb.storage.from(bucket).upload(path, file, { contentType: type, upsert: false }).catch(e => ({ error: e }));
  fileBusy = false;
  if (res.error) {
    const big = /size|413/i.test(String(res.error.message || '') + (res.error.statusCode || ''));
    fileMsg = { text: big ? t('fTooBig', { size: fileSize(file.size) }) : t('fFailed') };
    return renderFiles();
  }
  fileMsg = { text: t('fSaved'), ok: true };
  logChange('file_added', { bucket, name: file.name }); saveData();
  await loadFiles();
}

async function openFile(f) {
  if (!f || !sb) return;
  const w = window.open('', '_blank');   // opened now, so the phone does not block it as a pop-up
  const res = await sb.storage.from(f.bucket).createSignedUrl(f.path, 60).catch(() => ({ error: true }));
  if (res.error || !res.data) { if (w) w.close(); return toast(t('fOpenErr')); }
  if (w) w.location = res.data.signedUrl; else location.href = res.data.signedUrl;
}

async function deleteFile(f) {
  if (!f || !sb || !confirm(t('fDelAsk', { name: f.name }))) return;
  const res = await sb.storage.from(f.bucket).remove([f.path]).catch(() => ({ error: true }));
  if (res.error) return toast(t('fDelErr'));
  logChange('file_deleted', { bucket: f.bucket, name: f.name }); saveData();
  toast(t('fDeleted'));
  await loadFiles();
}

/* ------------------------------------------------------------------
   Sign-in with Supabase Auth (email and password).
   The password goes straight from this form to Supabase over HTTPS and is
   never saved by the app. Supabase keeps the session (a short-lived access
   token plus a refresh token) in this browser's localStorage and renews it
   by itself. Each account keeps its own data on this phone.
------------------------------------------------------------------ */
const cfg = window.VENDEAI_CONFIG || null;
const sb = cfg && window.supabase ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
}) : null;
let user = null, obMode = 'signup', obBusy = false, obOk = '';
const appUrl = () => location.origin + '/app/';

function hasCurrentConsent(doc) {
  return data.consents.some(c => c.document === doc && c.document_version === DOCS[doc].version && c.action === 'accepted');
}

// Load this account's data. Data saved on this phone before sign-in existed is adopted once.
function openUserData(u) {
  dataKey = DATA_KEY + ':' + u.id;
  let d = load(dataKey, null);
  if (!d) {
    const old = load(DATA_KEY, null);
    if (old) { d = old; try { localStorage.removeItem(DATA_KEY); } catch (e) { /* keep going */ } }
  }
  data = d || seedData();
  if (!data.consents) data.consents = [];
  if (data.profile === undefined) data.profile = null;
  if (!data.connections) data.connections = {};
  const m = u.user_metadata || {}, p = data.profile || {};
  data.profile = Object.assign({}, p, {
    name: p.name || m.name || u.email.split('@')[0],
    contact: u.email, contactType: 'email',
    country: p.country || m.country || 'MX',
    createdAt: p.createdAt || u.created_at
  });
  // The acceptances given at sign-up. The official record is in the database.
  (Array.isArray(m.consents) ? m.consents : []).forEach(c => addLocalConsent(c.document, c.version, c.language, u.created_at, 'signup_v2'));
  saveData();
}
function addLocalConsent(doc, version, language, at, form) {
  if (!DOCS[doc] || data.consents.some(x => x.document === doc && x.document_version === version)) return;
  data.consents.push({ id: uid('k'), document: doc, document_version: version, document_language: language || 'es',
    action: 'accepted', accepted_at: at, method: 'checkbox', form_id: form, app_version: APP_VERSION, ui_language: lang });
}
// Acceptances made on another phone count here too.
async function syncConsents() {
  const { data: rows, error } = await sb.from('consents').select('document, document_version, document_language, accepted_at').eq('action', 'accepted');
  if (error || !rows) return;
  rows.forEach(r => addLocalConsent(r.document, r.document_version, r.document_language, r.accepted_at, 'server'));
  saveData();
  showOnboardingIfNeeded();
}

// Demo mode (no Supabase settings yet): one local profile on this phone, no account.
function openDemoData() {
  dataKey = DATA_KEY + ':demo';
  let d = load(dataKey, null);
  if (!d) {
    const old = load(DATA_KEY, null);
    if (old) { d = old; try { localStorage.removeItem(DATA_KEY); } catch (e) { /* keep going */ } }
  }
  data = d || seedData();
  if (!data.consents) data.consents = [];
  if (data.profile === undefined) data.profile = null;
  if (!data.connections) data.connections = {};
}

// Welcome email, once per account: the server (api/welcome.js) checks who this is with Supabase,
// sends it through Resend and marks the account. The app never waits for it or shows an error.
function askWelcome(session) {
  if (!session || !session.access_token || data.welcomeAsked) return;
  fetch('/api/welcome', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify({ lang })
  }).then(r => r.json()).then(j => { if (j && (j.sent || j.already)) { data.welcomeAsked = new Date().toISOString(); saveData(); } }).catch(() => { /* email is optional */ });
}

// News and marketing emails (sent by tools/send-campaign.mjs). The choice lives on the account
// (user_metadata.marketing), and so does the plan (user_metadata.plan), so each seller gets the right email.
// The plan there only picks which email to send; it never unlocks anything.
function wantsNews() { return !!(user && user.user_metadata && user.user_metadata.marketing === true); }
function renderNewsBtn() {
  const b = document.getElementById('newsBtn');
  b.hidden = !user;
  if (user) b.textContent = t(wantsNews() ? 'newsOn' : 'newsOff');
}
async function setNews(on) {
  if (!sb || !user) return;
  const res = await sb.auth.updateUser({ data: { marketing: on } }).catch(() => null);
  if (res && !res.error && res.data && res.data.user) {
    user = res.data.user;
    logChange(on ? 'news_on' : 'news_off', {}); saveData();
    toast(t(on ? 'newsOnToast' : 'newsOffToast'));
  }
  renderNewsBtn();
}
function syncPlan() {
  const tier = (data.plan && data.plan.tier) || 0;
  if (sb && user && (user.user_metadata || {}).plan !== tier) sb.auth.updateUser({ data: { plan: tier } }).catch(() => { /* next sign-in tries again */ });
}
// Links from the emails: #email-off (stop the emails) and #planes (show the plans).
function handleEmailLinks() {
  if (location.hash === '#email-off') {
    if (!sb) return;
    if (!user) { toast(t('newsOffSignIn')); return; }   // keep the hash until they sign in
    history.replaceState(null, '', location.pathname);
    setNews(false);
  } else if (location.hash === '#planes' && (user || !sb)) {
    history.replaceState(null, '', location.pathname);
    showTab('home');
    setTimeout(() => { const p = document.querySelector('[data-panel="plans"]'); if (p) p.scrollIntoView({ behavior: 'smooth' }); }, 300);
  }
}
document.getElementById('newsBtn').addEventListener('click', () => setNews(!wantsNews()));

function onSession(event, session) {
  document.body.classList.remove('auth-wait');
  if (!sb) { openDemoData(); applyLang(); showTab(prefs.tab || 'sell'); showOnboardingIfNeeded(); return; }
  if (event === 'PASSWORD_RECOVERY') obMode = 'newpass';
  let u = session ? session.user : null;
  if (u && (u.is_anonymous || !u.email)) { sb.auth.signOut(); u = null; }   // email accounts only
  if ((u && u.id) !== (user && user.id)) {
    user = u;
    draft = null; sheetRows = null; connAsking = null; aiWording.clear(); aiTried.clear(); aiState = null;
    if (u) { openUserData(u); syncConsents(); askWelcome(session); syncPlan(); }
    else { dataKey = null; data = seedData(); }
    applyLang();
    showTab(prefs.tab || 'sell');
  }
  if (u) user = u;   // keep the latest account details (news choice, plan)
  showOnboardingIfNeeded();
  handleEmailLinks();
  renderNewsBtn();
}

function showOnboardingIfNeeded() {
  const el = document.getElementById('onboard');
  const biz = document.getElementById('bizStep');
  if (document.getElementById('langPicker').style.display === 'flex') return;   // language first
  let mode = null;
  if (!sb) mode = data.profile && hasCurrentConsent('terminos') && hasCurrentConsent('privacidad') ? null : 'demo';
  else if (obMode === 'newpass') mode = 'newpass';
  else if (!user) mode = ['signup', 'signin', 'reset', 'sent'].includes(obMode) ? obMode : 'signin';
  else if (!hasCurrentConsent('terminos') || !hasCurrentConsent('privacidad')) mode = 'reaccept';
  if (mode) {
    obMode = mode;
    biz.style.display = 'none';
    renderAuth();
    el.style.display = 'flex';
    return;
  }
  el.style.display = 'none';
  // Then the business questions, asked once.
  if (data.profile && !(data.profile.business && data.profile.business.answeredAt)) { bizMode = 'first'; renderBizStep(); biz.style.display = 'flex'; biz.scrollTop = 0; }
  else biz.style.display = 'none';
}

function renderAuth() {
  const $ = id => document.getElementById(id);
  $('ob-title').textContent = t('obTitles')[obMode];
  const sub = obMode === 'sent' ? '' : t('obSubs')[obMode] || '';
  $('ob-sub').textContent = sub; $('ob-sub').hidden = !sub;
  document.querySelectorAll('#obForm [data-modes]').forEach(el => { el.hidden = !el.dataset.modes.split(' ').includes(obMode); });
  const label = t('obSubmit')[obMode];
  $('ob-submit').hidden = !label;
  $('ob-submit').textContent = obBusy ? t('obWait') : label || '';
  $('ob-pass').autocomplete = obMode === 'signin' ? 'current-password' : 'new-password';
  const sw = { signup: ['obHaveAccount', 'signin'], signin: ['obNoAccount', 'signup'], reset: [null, 'signin'], sent: [null, 'signin'] }[obMode];
  $('ob-switch-q').textContent = sw && sw[0] ? t(sw[0]) : '';
  $('ob-switch').textContent = sw ? (sw[0] ? t('obSubmit')[sw[1]] : t('obBack')) : '';
  $('ob-switch').dataset.to = sw ? sw[1] : '';
  $('ob-ok').textContent = obOk; $('ob-ok').hidden = !obOk;
  const sel = $('ob-country'), v = sel.value || (lang === 'pt' ? 'BR' : 'MX');
  sel.innerHTML = COUNTRIES.map(c => `<option value="${c.code}">${esc(c[lang] || c.es)}</option>`).join('');
  sel.value = v;
  obCheck();
}
function obCheck() {
  const needsChecks = ['signup', 'reaccept', 'demo'].includes(obMode);
  const checked = document.getElementById('ob-terms').checked && document.getElementById('ob-privacy').checked;
  document.getElementById('ob-submit').disabled = obBusy || (needsChecks && !checked);
}
function obError(key) {
  const el = document.getElementById('ob-err');

function authErrorKey(error) {
  const code = error.code || '';
  if (error.name === 'AuthRetryableFetchError' || /failed to fetch|network/i.test(error.message || '')) return 'offline';
  if (/rate_limit/.test(code) || error.status === 429) return 'rate';
  if (code === 'email_exists') return 'user_already_exists';
  if (code === 'email_address_invalid') return 'email';
  return ['invalid_credentials', 'email_not_confirmed', 'user_already_exists', 'weak_password'].includes(code) ? code : 'generic';
}

async function submitAuth(e) {

  if (['signup', 'newpass'].includes(obMode) && pass.length < 8) return obError('pass');
  if (obMode === 'signin' && !pass) return obError('pass');
  obBusy = true; renderAuth();
  let error = null;
  try {
    if (obMode === 'signup') {
      const res = await sb.auth.signUp({ email, password: pass, options: {
        emailRedirectTo: appUrl(),
        data: { name, country: $('ob-country').value, language: lang, marketing: $('ob-news').checked, plan: 0,
          consents: ['terminos', 'privacidad'].map(doc => ({ document: doc, version: DOCS[doc].version, language: DOCS[doc].language,
            app_version: APP_VERSION, user_agent: navigator.userAgent.slice(0, 300) })) }
      } });
      error = res.error;
      if (!error && !res.data.session) { obMode = 'sent'; obOk = t('obSentConfirm', { email }); }
    } else if (obMode === 'signin') {
      error = (await sb.auth.signInWithPassword({ email, password: pass })).error;
    } else if (obMode === 'reset') {
      error = (await sb.auth.resetPasswordForEmail(email, { redirectTo: appUrl() })).error;
      if (!error) { obMode = 'sent'; obOk = t('obSentReset', { email }); }
    } else if (obMode === 'newpass') {
      error = (await sb.auth.updateUser({ password: pass })).error;
      if (!error) { obMode = 'signin'; toast(t('obPassSaved')); }
    } else if (obMode === 'reaccept') {
      const docs = ['terminos', 'privacidad'].filter(d => !hasCurrentConsent(d));
      error = (await sb.from('consents').insert(docs.map(d => ({ document: d, document_version: DOCS[d].version, document_language: DOCS[d].language,
        action: 'accepted', method: 'checkbox', form_id: 'reaccept_v1', app_version: APP_VERSION, ui_language: lang, user_agent: navigator.userAgent.slice(0, 300) })))).error;
      if (!error) { docs.forEach(d => addLocalConsent(d, DOCS[d].version, DOCS[d].language, new Date().toISOString(), 'reaccept_v1')); saveData(); }
    }
  } catch (err) { error = err; }
  obBusy = false;

  showOnboardingIfNeeded();
}

/* ------------------------------------------------------------------
   AI (Google Gemini) through our own server at /api/ai.
   The browser never sees the API key: it only sends the message and
   gets back an answer. If the AI is slow, busy, over its free limit or
   unreachable, the app falls back to its built-in rules and says so.
------------------------------------------------------------------ */
/* ------------------------------------------------------------------
   Plans and payment (Stripe Checkout, sandbox only). Prices follow prd.md.
   "Pagar" asks our server (/api/checkout) to open a Stripe payment page and
   sends the seller there. Stripe brings them back to /pago/exito.html, which
   checks the payment with our server and leaves a note (vendeai_pago) that the
   app picks up here. The card is typed on Stripe's page, never on ours.
------------------------------------------------------------------ */
const TIERS = { 0: 0, 1: 5.99, 2: 9.99, 3: 19.99 };
const TIER_NAMES = { 0: 'Freedom', 1: 'Standard', 2: 'Medium', 3: 'Business' };
const MOD_TIER = { precios: 1, cobrar: 2, vender: 3 };
const PAY_KEY = 'vendeai_pago';
const priceText = n => n ? 'US$ ' + TIERS[n].toFixed(2) : t('plFreePrice');

function claimPayment() {
  const p = load(PAY_KEY, null);
  if (!p || !dataKey || !TIERS[p.tier]) return;
  data.plan = { tier: p.tier, sessionId: p.sessionId, paidAt: p.paidAt, test: true };
  logChange('plan_paid', { tier: p.tier, sessionId: p.sessionId });
  saveData();
  try { localStorage.removeItem(PAY_KEY); } catch (e) { /* keep going */ }
  toast(t('plPaidToast', { name: TIER_NAMES[p.tier] }));
  syncPlan();
}

// The app's own suggestion: the smallest plan that covers every module recommend() found.
function ruleTier() {
  const recs = recommend();
  const tier = Math.max(0, ...recs.map(r => MOD_TIER[r.mod]));
  const reasons = [...new Set(recs.flatMap(r => r.reasons))].map(k => t('why')[k]);
  return { tier, why: tier ? t('plWhyRule', { name: TIER_NAMES[tier], reasons: reasons.join(', ') }) : t('plWhyFree'), ai: false };
}

// The AI's suggestion, kept per set of answers so the same answers never cost a second call.
const planTried = new Set(), planRetried = new Set();
let planBusy = false;
function bizKey() {
  const p = data.profile || {}, b = bizOf();
  return JSON.stringify([b.sector, b.sectorOther, !!b.credit, !!b.wholesale, b.needs || [], p.sellChannels || [], p.payMethods || [], lang]);
}
function suggestion() {
  const a = data.planAI;
  return a && a.key === bizKey() ? { tier: a.tier, why: a.why, ai: true } : ruleTier();
}
// The AI may only pick 0-3 and may only write the digits of that plan's price.
function planFromAI(p) {
  if (!p || !Number.isInteger(p.tier) || !(p.tier in TIERS)) return null;
  const why = String(p.why || '').trim();
  const allowed = new Set(TIERS[p.tier].toFixed(2).match(/\d+/g).concat(String(TIERS[p.tier])));
  if (!why || why.length > 300 || !(why.match(/\d+/g) || []).every(n => allowed.has(n))) return null;
  return { tier: p.tier, why };
}
function askPlanAI() {
  const key = bizKey();
  if (!bizOf().answeredAt || (data.planAI && data.planAI.key === key) || planTried.has(key) || planBusy) return;
  planTried.add(key); planBusy = true;
  const p = data.profile || {}, b = bizOf();
  const names = (list, dict) => (list || []).map(k => dict[k] || k);
  aiCall('plan', {
    business: {
      sector: b.sector === 'otro' ? (b.sectorOther || t('sectors').otro) : t('sectors')[b.sector] || '',
      sells_on: names(p.sellChannels, t('channels')), gets_paid_with: names(p.payMethods, t('pay')),
      sells_on_credit_or_installments: !!b.credit, also_sells_wholesale: !!b.wholesale,
      hardest_for_them: names(b.needs, t('needs')),
      sales_recorded: data.sales.filter(x => !x.undone).length, products: data.products.length
    },
    tiers: Object.keys(TIERS).map(n => ({ tier: Number(n), name: TIER_NAMES[n], price: n === '0' ? '0' : TIERS[n].toFixed(2), includes: t('plShort')[n] }))
  }).then(res => {
    planBusy = false;
    if ((res.error === 'slow' || res.error === 'busy') && !planRetried.has(key)) { planRetried.add(key); planTried.delete(key); }   // one more try, on the next screen
    const got = !res.error && planFromAI(res.plan);
    if (got) { data.planAI = Object.assign({ key, at: new Date().toISOString() }, got); logChange('plan_suggested', { tier: got.tier, by: 'ai' }); saveData(); }
    renderPlans();
  });
}

async function payTier(tier, btn) {
  if (location.protocol === 'file:' || !navigator.onLine) return toast(t('plErr').offline);

    });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.url && j.url.startsWith('https://checkout.stripe.com/')) { location.href = j.url; return; }

const AI_TIMEOUT_MS = 12000;
async function aiCall(task, payload) {
  if (location.protocol === 'file:') return { error: 'offline' };
  try {
    const r = await fetch('/api/ai', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ task, lang }, payload)),
      signal: AbortSignal.timeout(AI_TIMEOUT_MS)
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return { error: j.error || 'down' };
    return j;
  } catch (e) {
    return { error: e && e.name === 'TimeoutError' ? 'slow' : 'offline' };
  }
}

// The AI's reading of a sale, checked by the app. A number is kept only if it is in the
// message itself; a product only if it is on the seller's list; a name only if it was written.
const CHANNEL_WORDS = {
  whatsapp: ['whats', 'wpp', 'wsp', 'zap'], instagram: ['insta'], facebook: ['face', 'fb', 'marketplace'], tiktok: ['tik'],
  mercadolibre: ['mercado', 'meli'], persona: ['persona', 'pessoal', 'presencial', 'person'], catalogo: ['catalog']
};
const DAY_INDEX = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };
function numbersIn(text) { return (String(text).match(/\d+(?:[.,]\d{1,2})?/g) || []).map(x => parseFloat(x.replace(',', '.'))); }
function saleFromAI(a, text, rules) {
  if (!a || typeof a !== 'object') return null;
  const nums = numbersIn(text), words = norm(text).split(/[^a-z0-9]+/);
  const count = v => Number.isInteger(v) && v > 0 && (nums.includes(v) || words.some(w => NUM_WORDS[w] === v));
  const qty = count(a.quantity) ? a.quantity : null;
  const stated = v => typeof v === 'number' && v > 0 && (nums.includes(v) || (qty && nums.includes(round2(v * qty))));
  const product = data.products.find(p => p.id === a.product_id) || null;
  const cname = typeof a.customer_name === 'string' ? a.customer_name.trim() : '';
  const today = todayDate();
  let due = null;
  if (typeof a.due_date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(a.due_date) && a.due_date >= toISO(today)) due = a.due_date;
  else if (a.due_day === 'tomorrow') due = toISO(addDays(today, 1));
  else if (a.due_day in DAY_INDEX) due = toISO(addDays(today, ((DAY_INDEX[a.due_day] - today.getDay() + 7) % 7) || 7));
  const paidMode = ['all', 'half', 'none', 'amount'].includes(a.paid) ? a.paid : null;
  const paidAmount = paidMode === 'amount' && typeof a.paid_amount === 'number' && nums.includes(a.paid_amount) ? a.paid_amount : null;
  const out = {
    productId: product ? product.id : null,
    productHint: !product && typeof a.product_words === 'string' ? a.product_words.trim().slice(0, 60) || null : null,
    qty,
    unitPrice: stated(a.unit_price) ? a.unit_price : null,
    wholesale: !!a.wholesale || rules.wholesale,
    customerName: cname && norm(text).includes(norm(cname)) ? cname.slice(0, 40) : null,
    channel: SELL_CHANNELS.includes(a.channel) && CHANNEL_WORDS[a.channel].some(w => norm(text).includes(w)) ? a.channel : null,
    paidMode: paidMode === 'amount' && paidAmount === null ? null : paidMode,
    paidAmount,
    installments: count(a.installments) && a.installments > 1 ? a.installments : null,
    dueDate: due
  };
  // Where the AI left a gap, keep what the built-in reader found (it never invents either).
  for (const k in out) if (out[k] === null && rules[k] !== null && rules[k] !== undefined) out[k] = rules[k];
  return out;
}

// The assistant: the app finds each issue and does the math; the AI only rewrites the sentence.
function buildChecks() {
  const today = todayDate(), todayISO = toISO(today), since = toISO(addDays(today, -14));
  const live = data.sales.filter(s => !s.undone);
  const sold14 = {}, lastSale = {};
  live.forEach(s => {
    if (s.date >= since) sold14[s.productId] = (sold14[s.productId] || 0) + s.qty;
    if (!lastSale[s.productId] || s.date > lastSale[s.productId]) lastSale[s.productId] = s.date;
  });
  const firstSale = live.reduce((m, s) => (!m || s.date < m ? s.date : m), null);
  const lastAny = live.reduce((m, s) => (!m || s.date > m ? s.date : m), null);
  const out = [];
  const add = (id, kind, tpl, facts, rank) => out.push({ id, kind, rank, facts, draft: t('asT')[tpl].replace(/\{(\w+)\}/g, (_, k) => facts[k]) });

  live.forEach(s => s.schedule.forEach((x, i) => {
    if (x.paid) return;
    const cu = data.customers.find(c => c.id === s.customerId), customer = cu ? cu.name : t('noCustomer');
    if (x.due && x.due < todayISO) add(`late-${s.id}-${i}`, 'cobrar', 'late', { customer, amount: money(x.amount), date: fmtDate(x.due), days: daysBetween(x.due, todayISO) }, 1);
    else if (!x.due) add(`nodue-${s.id}-${i}`, 'cobrar', 'noDue', { customer, amount: money(x.amount) }, 3);
  }));
  data.products.forEach(p => {
    if (p.stock < 0) add('neg-' + p.id, 'olvido', 'negStock', { product: p.name, stock: p.stock }, 1);
    else if (p.stock <= 3) add('stock-' + p.id, 'reponer', 'restock', { product: p.name, stock: p.stock, buy: Math.max(3, Math.ceil((sold14[p.id] || 0) * 1.5) - p.stock) }, 2);
    if (!(p.cost > 0)) add('cost-' + p.id, 'olvido', 'noCost', { product: p.name }, 3);
    else if (p.retail < p.cost * 1.2) add('price-' + p.id, 'precio', 'price', { product: p.name, cost: money(p.cost), price: money(p.retail), suggested: money(Math.ceil(p.cost * 1.4 * 2) / 2) }, 2);
    if (bizOf().wholesale && p.wholesale >= p.retail) add('whole-' + p.id, 'precio', 'noWholesale', { product: p.name, price: money(p.retail) }, 4);
    if (firstSale && firstSale <= since && p.stock > 3 && (!lastSale[p.id] || lastSale[p.id] < since)) add('promo-' + p.id, 'promo', 'promo', { product: p.name, stock: p.stock }, 4);
  });
  if (lastAny && daysBetween(lastAny, todayISO) >= 3) add('idle', 'olvido', 'idle', { days: daysBetween(lastAny, todayISO) }, 3);
  return out.sort((a, b) => a.rank - b.rank).slice(0, 8);
}

const aiWording = new Map();   // the app's sentence → the AI's rewrite
const aiTried = new Set();
let aiState = null;            // null, 'busy', 'ok', or an error code

// The AI may only use numbers that are already in the app's sentence.
function numbersOK(text, c) {
  const allowed = new Set((Object.values(c.facts).join(' ') + ' ' + c.draft).match(/\d+/g) || []);
  return (String(text).match(/\d+/g) || []).every(n => allowed.has(n));
}
function maybeWordWithAI(checks) {
  const todo = checks.filter(c => !aiWording.has(c.draft) && !aiTried.has(c.draft));
  if (!todo.length || aiState === 'busy') return;
  todo.forEach(c => aiTried.add(c.draft));
  aiState = 'busy';
  aiCall('advice', {
    sector: bizOf().sector ? t('sectors')[bizOf().sector] : '',
    items: todo.map(c => ({ id: c.id, kind: c.kind, facts: c.facts, draft: c.draft }))
  }).then(res => {
    if (res.error) aiState = res.error;
    else {
      (res.items || []).forEach(i => {
        const c = todo.find(x => x.id === i.id);
        const text = String(i.text || '').trim();
        if (c && text && text.length <= 300 && numbersOK(text, c)) aiWording.set(c.draft, text);
      });
      aiState = 'ok';
    }
    renderHome();
  });
}
function assistantHTML(checks) {
  const worded = checks.some(c => aiWording.has(c.draft));
  const failed = aiState && aiState !== 'ok' && aiState !== 'busy';
  const note = !checks.length ? ''
    : aiState === 'busy' ? t('asBusy')
    : failed ? (t('asFail')[aiState] || t('asFail').down)
    : worded ? t('asByAI') : '';
  return `<div class="panel home-section assistant" data-panel="assistant">
    <h2>${esc(t('asTitle'))}</h2>
    <ul class="rows">${checks.length ? checks.map(c => `<li style="display:block">
      <span class="tag">${esc(t('asKinds')[c.kind])}</span>
      <div class="as-text">${esc(aiWording.get(c.draft) || c.draft)}</div>
    </li>`).join('') : `<li class="empty">${esc(t('asNone'))}</li>`}</ul>
    ${note ? `<p class="as-note">${esc(note)}${failed ? ` <button class="linkbtn" id="asRetry">${esc(t('asRetry'))}</button>` : ''}</p>` : ''}
  </div>`;
}

});

if (!lang) { lang = 'es'; document.getElementById('langPicker').style.display = 'flex'; }
applyLang();
showTab(prefs.tab || 'sell');
// Supabase says who is signed in (from the saved session, or a link from an email),
// then the app shows either the sign-in screen or the seller's own data.
if (sb) sb.auth.onAuthStateChange((event, session) => setTimeout(() => onSession(event, session), 0));
else onSession('NO_CONFIG', null);
</script>
</body>
</html>
