<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>VendeAI · Pago cancelado</title>
<meta name="description" content="Cancelaste el pago. No se hizo ningún cobro.">
<link rel="icon" type="image/png" sizes="192x192" href="../app/icons/icon-192.png">
<!-- Where Stripe sends the seller if they leave the payment page without paying. Nothing was charged. -->
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--foreground); line-height: 1.5; }
  main { max-width: 480px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  .logo { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 600; }
  .logo span { border-bottom: 2px solid var(--accent); }
  .card { background: var(--card); border-radius: var(--radius-xl); padding: 28px 20px; margin-top: 28px; }
  h1 { font-family: var(--font-heading); font-size: 1.6rem; margin: 0 0 8px; }
  p { color: var(--muted-foreground); margin: 0 0 18px; }
  a.btn { display: inline-block; background: var(--primary); color: var(--primary-foreground); text-decoration: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
</style>
</head>
<body class="bg-notebook">
<main>
  <div class="logo">Vende<span>AI</span></div>
  <div class="card">
    <h1 id="title"></h1>
    <p id="body"></p>
    <a class="btn" href="/app/" id="back"></a>
  </div>
</main>
<script>
const TEXT = {
  es: { title: 'No se hizo ningún cobro', body: 'Cancelaste el pago. Sigues con la versión gratis y no perdiste nada.', back: 'Volver a VendeAI' },
  pt: { title: 'Nenhuma cobrança foi feita', body: 'Você cancelou o pagamento. Continua na versão grátis e não perdeu nada.', back: 'Voltar ao VendeAI' },
  en: { title: 'You were not charged', body: 'You cancelled the payment. You keep the free version and lost nothing.', back: 'Back to VendeAI' }
};
let lang = 'es';
try { lang = (JSON.parse(localStorage.getItem('vendeai_preferencias') || '{}').lang) || 'es'; } catch (e) { /* Spanish */ }
const T = TEXT[lang] || TEXT.es;
document.documentElement.lang = lang;
for (const k of ['title', 'body', 'back']) document.getElementById(k).textContent = T[k];
</script>
</body>
</html>
