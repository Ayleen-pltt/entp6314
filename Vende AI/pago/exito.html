<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>VendeAI · Pago</title>
<meta name="description" content="Confirmación de tu pago en VendeAI.">
<link rel="icon" type="image/png" sizes="192x192" href="../app/icons/icon-192.png">
<!-- Where Stripe sends the seller after paying. The page asks our server (/api/checkout)
     whether Stripe really marked the session as paid; the address alone proves nothing. -->
<link rel="stylesheet" href="../tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--foreground); line-height: 1.5; }
  main { max-width: 480px; margin: 0 auto; padding: 56px 16px; text-align: center; }
  .logo { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 600; }
  .logo span { border-bottom: 2px solid var(--accent); }
  .card { background: var(--card); border-radius: var(--radius-xl); padding: 28px 20px; margin-top: 28px; }
  .mark { font-size: 2.4rem; line-height: 1; }
  h1 { font-family: var(--font-heading); font-size: 1.6rem; margin: 12px 0 8px; }
  p { color: var(--muted-foreground); margin: 0 0 18px; }
  .warn { color: var(--destructive); }
  a.btn { display: inline-block; background: var(--primary); color: var(--primary-foreground); text-decoration: none; border-radius: 999px; padding: 12px 24px; font-weight: 700; }
  .test { font-size: 0.78rem; color: var(--muted-foreground); margin-top: 22px; }
</style>
</head>
<body class="bg-notebook">
<main>
  <div class="logo">Vende<span>AI</span></div>
  <div class="card">
    <div class="mark" id="mark">…</div>
    <h1 id="title"></h1>
    <p id="body"></p>
    <a class="btn" href="/app/" id="back"></a>
  </div>
  <p class="test" id="test"></p>
</main>
<script>
const TEXT = {
  es: { checking: 'Revisando tu pago…', okTitle: '¡Pago recibido!', okBody: 'Ya tienes VendeAI {tier}. Lo verás en la app.',
        noTitle: 'No vemos el pago todavía', noBody: 'Stripe aún no lo confirma. Si te cobraron, escríbenos y lo revisamos.',
        errTitle: 'No pudimos revisar tu pago', errBody: 'Revisa tu internet y vuelve a abrir esta página.', back: 'Volver a VendeAI',
        test: 'Modo de prueba: no se cobró dinero real.' },
  pt: { checking: 'Verificando seu pagamento…', okTitle: 'Pagamento recebido!', okBody: 'Você já tem o VendeAI {tier}. Vai ver no app.',
        noTitle: 'Ainda não vemos o pagamento', noBody: 'A Stripe ainda não confirmou. Se você foi cobrado, fale com a gente.',
        errTitle: 'Não conseguimos verificar seu pagamento', errBody: 'Confira sua internet e abra esta página de novo.', back: 'Voltar ao VendeAI',
        test: 'Modo de teste: nenhum dinheiro real foi cobrado.' },
  en: { checking: 'Checking your payment…', okTitle: 'Payment received!', okBody: 'You now have VendeAI {tier}. You will see it in the app.',
        noTitle: 'We don’t see the payment yet', noBody: 'Stripe hasn’t confirmed it. If you were charged, write to us and we’ll check.',
        errTitle: 'We couldn’t check your payment', errBody: 'Check your internet and open this page again.', back: 'Back to VendeAI',
        test: 'Test mode: no real money was charged.' }
};
const NAMES = { 1: 'Standard', 2: 'Medium', 3: 'Business' };
let lang = 'es';
try { lang = (JSON.parse(localStorage.getItem('vendeai_preferencias') || '{}').lang) || 'es'; } catch (e) { /* Spanish */ }
const T = TEXT[lang] || TEXT.es;
document.documentElement.lang = lang;
const $ = id => document.getElementById(id);
function show(mark, title, body) { $('mark').textContent = mark; $('title').textContent = title; $('body').textContent = body; }
$('back').textContent = T.back;
$('test').textContent = T.test;
show('…', T.checking, '');

const id = new URLSearchParams(location.search).get('session_id') || '';
fetch('/api/checkout?session_id=' + encodeURIComponent(id))
  .then(r => r.json())
  .then(j => {
    if (!j.paid) return show('!', T.noTitle, T.noBody);
    // Hand the plan to the app; it picks this up the next time it opens.
    try { localStorage.setItem('vendeai_pago', JSON.stringify({ tier: j.tier, sessionId: id, paidAt: new Date().toISOString() })); } catch (e) { /* the app can't see it, but the payment is still done */ }
    show('✓', T.okTitle, T.okBody.replace('{tier}', NAMES[j.tier] || ''));
  })
  .catch(() => show('!', T.errTitle, T.errBody));
</script>
</body>
</html>
